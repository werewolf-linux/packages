# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  source: content
  reason: Upstream publishes an unversioned model archive; changed bytes increment the APK epoch.
melange:
  # Chroma's default CPU embedding model, pinned to its upstream verification hash.
  package:
    name: onnx-minilm-l6-v2
    version: 1.0.0
    epoch: 4
    description: Verified all-MiniLM-L6-v2 ONNX embedding model and tokenizer
    copyright:
      - license: Apache-2.0
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
        - ca-certificates-bundle
  pipeline:
    - uses: fetch
      with:
        uri: https://chroma-onnx-models.s3.amazonaws.com/all-MiniLM-L6-v2/onnx.tar.gz
        expected-sha256: 913d7300ceae3b2dbc2c50d1de4baacab4be7b9380491c27fab7418616a16ec3
        extract: false
    - runs: |
        mkdir model
        tar -xzf onnx.tar.gz -C model
        dest=${{targets.destdir}}/usr/share/onnx/minilm-l6-v2/onnx
        mkdir -p "$dest"
        for file in config.json model.onnx special_tokens_map.json tokenizer_config.json tokenizer.json vocab.txt; do
          install -m644 "model/onnx/$file" "$dest/$file"
        done
        install -Dm644 LICENSE.minilm ${{targets.destdir}}/usr/share/licenses/onnx-minilm-l6-v2/LICENSE
  test:
    pipeline:
      - name: Installed package consumers
        runs: |
          set -eu
          root=/usr/share/onnx/minilm-l6-v2/onnx
          test "$(wc -c <"$root/model.onnx")" -gt 1000000
          test "$(wc -c <"$root/vocab.txt")" -gt 1000
          for name in config.json tokenizer.json tokenizer_config.json special_tokens_map.json; do
            werewolf-tools/package-helper json-check "$root/$name"
          done
changes:
  - what: Chroma's default CPU embedding model, pinned to its upstream verification hash.
    why: Provide an independently maintained application context with immutable sources and separately updatable Wolfi dependencies.
    evidence:
      - package.yaml
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
test:
  confined: true
