# Vendor binaries, unchanged, with an immutable, checksum-pinned codec bundle.
# Plex uses its own musl loader and libraries. Guest confinement belongs to
# Werewolf's plex form, not a replacement libc or a binary patch.
package:
  name: plexmediaserver
  version: 1.43.5.11079
  epoch: 0
  description: Plex Media Server with build-time codec dependencies
  # The vendor tree carries its private musl ABI and Python Script Host.
  # Resource-script shebangs must not pull an unrelated system Python 2.
  options:
    no-depends: true
  copyright:
    - license: LicenseRef-Plex

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - binutils
      - xz

pipeline:
  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://repo.plex.tv/deb/pool/main/p/plexmediaserver/plexmediaserver_1.43.5.11079-b3b13e506_arm64.deb
      expected-sha256: 8af36b17f886e344140a8b47e4e2ef653f31c786d2eaa7387442f5b606200717
      extract: false

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-aarch64-standard/libh264_decoder.so
      expected-sha256: 1417c2fcf3b6a3d33d9006410f09d711086f53afc1ccbe7df37cb63018f95268
      extract: false

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-aarch64-standard/liblibx264_encoder.so
      expected-sha256: 186cb0f59df5f7b16db1d4e3cbd1930b9ba9ca41b964727351de667540c43655
      extract: false

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-aarch64-standard/libaac_decoder.so
      expected-sha256: fbfc2cd1929cc9a825c9d222ee97aa62a44d2e531fa420bf48acba611265f5b4
      extract: false

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-aarch64-standard/libaac_encoder.so
      expected-sha256: 52b1e80c0912b29112213125a564e1978506112e61151b081502c7f52933a4a1
      extract: false

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-aarch64-standard/libhevc_decoder.so
      expected-sha256: a508d2241efe9f18bedd37c83ec790460012bc5a0277018dda9cee1731c7a6da
      extract: false

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-aarch64-standard/libmp3_decoder.so
      expected-sha256: 2deea159078946b9b60c51141cbbd971b6a233296ba5d6c4b5bd570066d3b78d
      extract: false

  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://repo.plex.tv/deb/pool/main/p/plexmediaserver/plexmediaserver_1.43.5.11079-b3b13e506_amd64.deb
      expected-sha256: 74e9a71c97e06d6e925cc4398279141fd838ee9df446f90e769614fa2c87a206
      extract: false

  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-x86_64-standard/libh264_decoder.so
      expected-sha256: 88aa53dbd62b71251b0a0938da8dcb9cf450195ad453f35eb59f3ef213ee0773
      extract: false

  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-x86_64-standard/liblibx264_encoder.so
      expected-sha256: 987d78882567acb753a63e2d4521cec921405a2d6d091b76317a02c7cdba352c
      extract: false

  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-x86_64-standard/libaac_decoder.so
      expected-sha256: 24795482c7cbaa472434bd31c60cf95352d9c5614621581f440535679dfbd22c
      extract: false

  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-x86_64-standard/libaac_encoder.so
      expected-sha256: 41b3bd181f50150849f640a17f0b0c57042a501d9960e7a07b2b8383920a8f1d
      extract: false

  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-x86_64-standard/libhevc_decoder.so
      expected-sha256: e116f04ecc6c51189cc26143293ac5a45b1c1bfeb1bde29741368132fcea97f0
      extract: false

  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://downloads.plex.tv/codecs/a336ba9-16a9aaf440ee9a92b75f070b/linux-x86_64-standard/libmp3_decoder.so
      expected-sha256: b397f344f9e49ee8912d8ba2486f240144955b7986784fc01e8ab50ef37503dd
      extract: false

  - runs: |
      ar x plexmediaserver_*.deb data.tar.xz
      tar -xJf data.tar.xz ./usr/lib/plexmediaserver
      home="${{targets.destdir}}/usr/lib/plexmediaserver"
      mkdir -p "$(dirname "$home")"
      cp -a usr/lib/plexmediaserver "$home"
      # Keep an unmodified helper at a second path for supervisors that
      # interpose on the ordinary helper pathname. Preserve its RUNPATH.
      mkdir -p "$home/isolated"
      cp "$home/Plex Transcoder" "$home/isolated/Plex Transcoder"
      ln -s ../lib "$home/isolated/lib"
      codecs="$home/Codecs/Plex Media Server/Codecs/a336ba9-16a9aaf440ee9a92b75f070b-linux-${{build.arch}}"
      mkdir -p "$codecs" "$home/Codecs/Plex Media Server/Drivers"
      for codec in lib*_decoder.so lib*_encoder.so; do
        install -m644 "$codec" "$codecs/$codec"
      done
      chmod -R go-w "$home"
      install -Dm644 sources.json "${{targets.destdir}}/usr/share/plexmediaserver/sources.json"

# Plex's signed APT metadata and codec manifests are checked by package plex-verify.
# Refresh the version and every dependent codec pin together; never select
# a new binary or download native code inside a running guest.
update:
  enabled: false

test:
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
  pipeline:
    - runs: |
        /usr/lib/plexmediaserver/"Plex Media Server" --version | grep -Fx 'v1.43.5.11079-b3b13e506'
        /usr/lib/plexmediaserver/isolated/"Plex Transcoder" -version
