# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  github:
    identifier: Velocidex/velociraptor
    strip-prefix: v
melange:
  # Velociraptor for werewolf's velociraptor form: upstream's release for
  # each arch, pinned by sha256. The linux build is glibc, which Wolfi is.
  # There is no musl build for arm64, so both arches take the glibc binary.
  package:
    name: velociraptor
    version: 0.77.3
    epoch: 6
    description: Endpoint visibility and collection server
    copyright:
      - license: AGPL-3.0-only
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
  pipeline:
    - if: ${{build.arch}} == 'aarch64'
      uses: fetch
      with:
        uri: https://github.com/Velocidex/velociraptor/releases/download/v${{package.version}}/velociraptor-v${{package.version}}-linux-arm64.gz
        expected-sha256: f28e097c98bee125bf65adfe64937c9699b4d77742b7ab12f186a065298e72c3
        extract: false
    - if: ${{build.arch}} == 'x86_64'
      uses: fetch
      with:
        uri: https://github.com/Velocidex/velociraptor/releases/download/v${{package.version}}/velociraptor-v${{package.version}}-linux-amd64.gz
        expected-sha256: c2c4eb585f16b622cd57de04995a7a13c076ee455bc2a828fd9243cec2ccfed8
        extract: false
    - runs: |
        gzip -d velociraptor-v${{package.version}}-linux-*.gz
        install -Dm755 velociraptor-v${{package.version}}-linux-* \
          ${{targets.destdir}}/usr/bin/velociraptor
  test:
    pipeline:
      - name: Installed package consumers
        runs: velociraptor version
changes:
  - what: 'Velociraptor for werewolf''s velociraptor form: upstream''s release for each arch, pinned by sha256. The linux build is glibc, which Wolfi is. There is no musl build for arm64, so both arches take the glibc binary.'
    why: Provide an independently maintained application context with immutable sources and separately updatable Wolfi dependencies.
    evidence:
      - package.yaml
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
test:
  confined: true
