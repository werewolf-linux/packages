# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  components:
    gvm-libs-version:
      prefix: v
      repo: greenbone/gvm-libs
      source: github
  github:
    identifier: greenbone/pg-gvm
    strip-prefix: v
melange:
  # PostgreSQL's Greenbone extension, built for PostgreSQL 18 as the form uses.
  # Only gvm-libs' base library is needed; scanner libraries,
  # build tools and headers stay out of the runtime image.
  package:
    name: pg-gvm
    version: "22.6.19"
    epoch: 2
    description: Greenbone PostgreSQL extension and its base library
    copyright:
      - license: GPL-3.0-or-later
  vars:
    gvm-libs-version: 23.15.0
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - build-base
        - busybox
        - ca-certificates-bundle
        - cmake
        - glib-dev
        - libical-dev~4
        - patch
        - pkgconf
        - postgresql-dev~18
  pipeline:
    - runs: mkdir -p gvm-libs pg-gvm
    - uses: fetch
      with:
        uri: https://github.com/greenbone/gvm-libs/archive/refs/tags/v${{vars.gvm-libs-version}}.tar.gz
        expected-sha256: 5fc60b16c5d40f802bb61c8ce1c24f147bd3a98c680be70e07c39b0331f5aa21
        directory: gvm-libs
    - uses: fetch
      with:
        uri: https://github.com/greenbone/pg-gvm/archive/refs/tags/v${{package.version}}.tar.gz
        expected-sha256: "2f8715530175ac640660852fad9817094bbd9abed9f2432a2dd054206dbc7891"
        directory: pg-gvm
    - runs: patch --batch --fuzz=0 -p1 -d pg-gvm < patches/libical4.patch
    - runs: |
        printf '\nadd_subdirectory(base)\n' >>gvm-libs/CMakeLists.txt
        cmake -S gvm-libs -B build-base \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
          -DLIBDIR=/usr/lib -DSKIP_SRC=ON
        cmake --build build-base -j"$(nproc)"
        cmake --install build-base
        cmake -S pg-gvm -B build-pg \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
        cmake --build build-pg -j"$(nproc)"
        DESTDIR="${{targets.destdir}}" cmake --install build-base
        DESTDIR="${{targets.destdir}}" cmake --install build-pg
        rm -rf "${{targets.destdir}}/usr/include" \
          "${{targets.destdir}}/usr/lib/pkgconfig" \
          "${{targets.destdir}}/run"
    - uses: strip
  test:
    environment:
      contents:
        packages:
          - postgresql~18
          - postgresql-client~18
    pipeline:
      - name: Installed PostgreSQL extension
        runs: |
          root=$(mktemp -d)
          initdb -D "$root/data" -U tester --auth=trust --no-locale
          pg_ctl -D "$root/data" -l "$root/server.log" -o "-F -k $root -c listen_addresses=''" -w start
          trap 'pg_ctl -D "$root/data" -m immediate -w stop' EXIT
          psql -h "$root" -U tester -d postgres -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION "pg-gvm";'
          expected='${{package.version}}'
          expected=${expected%.*}
          actual=$(psql -h "$root" -U tester -d postgres -Atc "SELECT extversion FROM pg_extension WHERE extname='pg-gvm'")
          test "$actual" = "$expected"
          psql -h "$root" -U tester -d postgres -v ON_ERROR_STOP=1 -f recurrence.sql
changes:
  - what: PostgreSQL's Greenbone extension, built for PostgreSQL 18 as the form uses. Only gvm-libs' base library is needed; scanner libraries, build tools and headers stay out of the runtime image.
    why: Provide an independently maintained application context with immutable sources and separately updatable Wolfi dependencies.
    evidence:
      - package.yaml
  - what: Use libical 4's reference-counted recurrence rules and counted BY arrays.
    why: Build against the supported Wolfi library without carrying a retired libical 3 runtime.
    evidence:
      - patches/libical4.patch
      - tests/recurrence.sql
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
test:
  confined: true
