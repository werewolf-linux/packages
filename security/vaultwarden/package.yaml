# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  components:
    web-vault-version:
      prefix: v
      repo: dani-garcia/bw_web_builds
      source: github
  github:
    identifier: dani-garcia/vaultwarden
melange:
  # Vaultwarden for werewolf's vaultwarden form, as Wolfi would package it:
  # built by melange in Wolfi's environment with Wolfi's Rust, linked to
  # Wolfi's OpenSSL and SQLite, so their fixes reach a machine with the rest
  # of its packages (howl unpacks it into the image and checks what it
  # links: cmd/howl/melange.zig). cargo-auditable records its crates in the
  # binary, for scanners. Offered to wolfi-dev/os as it is; when Wolfi ships
  # it, the form names the package and this file goes.
  package:
    name: vaultwarden
    version: 1.37.4
    epoch: 6
    description: Bitwarden-compatible password manager server
    copyright:
      - license: AGPL-3.0-only
  vars:
    web-vault-version: 2026.7.0
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - build-base
        - busybox
        - ca-certificates-bundle
        - curl
        - cargo-auditable
        - openssl-dev
        - pkgconf
        - patch
        - rust-1.98
        - sqlite-dev
  pipeline:
    - uses: fetch
      with:
        uri: https://github.com/dani-garcia/vaultwarden/archive/refs/tags/${{package.version}}.tar.gz
        expected-sha256: d31a3ef5456619cfe424f0586f4ecadd186e22513a93bbeab6bc2f09cda803a7
    # SQLite and OpenSSL from Wolfi, dynamically; mimalloc in its secure mode
    # (guard pages, encrypted free lists), compiled in.
    - runs: |
        patch --batch --fuzz=0 -p1 < http-features.patch
        VW_VERSION=${{package.version}} cargo auditable build --release --locked --features sqlite_system,enable_mimalloc
        cargo tree --locked --edges normal --prefix none --format '{p}' --features sqlite_system,enable_mimalloc > /tmp/runtime-crates
        if grep -E '^(brotli|brotli-decompressor|zstd|zstd-sys) ' /tmp/runtime-crates; then exit 1; fi
        sh consumers.sh
        install -Dm755 target/release/vaultwarden ${{targets.destdir}}/usr/bin/vaultwarden
    - uses: strip
  subpackages:
    - name: vaultwarden-web
      description: Vaultwarden's web vault, built by the project from Bitwarden's clients
      pipeline:
        - runs: mkdir -p web-vault
        - uses: fetch
          with:
            uri: https://github.com/dani-garcia/bw_web_builds/releases/download/v${{vars.web-vault-version}}/bw_web_v${{vars.web-vault-version}}.tar.gz
            expected-sha256: 002e972bf0d0487ec0324b06d916de33e29de4c29bffd92ee3b843084c300570
            directory: web-vault
        - runs: |
            mkdir -p ${{targets.subpkgdir}}/usr/share/vaultwarden
            cp -a web-vault ${{targets.subpkgdir}}/usr/share/vaultwarden/web-vault
  test:
    pipeline:
      - name: Installed package consumers
        runs: vaultwarden --version | grep -F '${{package.version}}'
changes:
  - what: 'Vaultwarden for werewolf''s vaultwarden form, as Wolfi would package it: built by melange in Wolfi''s environment with Wolfi''s Rust, linked to Wolfi''s OpenSSL and SQLite, so their fixes reach a machine with the rest of its packages (howl unpacks it into the image and checks what it links: cmd/howl/melange.zig). cargo-auditable records its crates in the binary, for scanners. Offered to wolfi-dev/os as it is; when Wolfi ships it, the form names the package and this file goes.'
    why: Provide an independently maintained application context with immutable sources and separately updatable Wolfi dependencies.
    evidence:
      - package.yaml
  - evidence:
      - package.yaml
      - http-features.patch
      - consumers.sh
    what: The HTTP client omits Brotli, Zstd, SOCKS and system-proxy support; gzip, deflate, HTTP/2, TLS and normal vault operation remain.
    why: Establish the package's minimized policy.
    claims:
      - minimized
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
test:
  confined: true
