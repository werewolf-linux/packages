# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  github:
    identifier: MariaDB/server
    strip-prefix: mariadb-
melange:
  # MariaDB's newest stable release, as one unversioned package, without PAM.
  # From Wolfi's mariadb-13.1 recipe; see package.yaml for every change.
  package:
    name: mariadb
    version: 13.0.2
    epoch: 6
    description: 'The MariaDB open source relational database (Werewolf: newest stable, no PAM)'
    copyright:
      - license: GPL-3.0-or-later
    resources:
      cpu: "8"
      memory: 24Gi
    dependencies:
      runtime:
        - ${{package.name}}-dump=${{package.full-version}}
    test-resources:
      cpu: "1"
      memory: 5Gi
  vars:
    openssl-version: "4.0"
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - bash
        - bison
        - build-base
        - busybox
        - ca-certificates-bundle
        - cmake
        - glibc-2.44-dev
        - libaio-dev
        - libevent-dev
        - ncurses-dev
        - openssl-${{vars.openssl-version}}-dev # FTBFS with openssl-hardened-dev due to missing SSL_get_peer_certificate
        - pcre2-dev
        - readline-dev
        - samurai
        - wolfi-baselayout
        - xz-dev
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/MariaDB/server.git
        tag: mariadb-${{package.version}}
        expected-commit: 620a4b5624222048fece7fe1789978ae0675cae2
    - name: Cmake
      runs: |
        cmake . -G Ninja \
          -DBUILD_CONFIG=mysql_release \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DSYSCONFDIR=/etc \
          -DSYSCONF2DIR=/etc/my.cnf.d \
          -DMYSQL_DATADIR=/var/lib/mysql \
          -DMYSQL_UNIX_ADDR=/run/mysqld/mysqld.sock \
          -DDEFAULT_CHARSET=utf8mb4 \
          -DDEFAULT_COLLATION=utf8mb4_general_ci \
          -DENABLED_LOCAL_INFILE=ON \
          -DINSTALL_INFODIR=share/info \
          -DINSTALL_MANDIR=share/man \
          -DINSTALL_PLUGINDIR=lib/${{package.name}}/plugin \
          -DINSTALL_SCRIPTDIR=bin \
          -DINSTALL_INCLUDEDIR=include/mysql \
          -DINSTALL_DOCREADMEDIR=share/doc/${{package.name}} \
          -DINSTALL_SUPPORTFILESDIR=share/${{package.name}} \
          -DINSTALL_MYSQLSHAREDIR=share/${{package.name}} \
          -DINSTALL_DOCDIR=share/doc/${{package.name}} \
          -DTMPDIR=/var/tmp \
          -DCONNECT_WITH_MYSQL=ON \
          -DCONNECT_WITH_LIBXML2=system \
          -DCONNECT_WITH_ODBC=NO \
          -DCONNECT_WITH_JDBC=NO \
          -DPLUGIN_ARCHIVE=YES \
          -DPLUGIN_ARIA=YES \
          -DPLUGIN_BLACKHOLE=YES \
          -DPLUGIN_CASSANDRA=NO \
          -DPLUGIN_CSV=YES \
          -DPLUGIN_MYISAM=YES \
          -DPLUGIN_MROONGA=NO \
          -DPLUGIN_OQGRAPH=NO \
          -DPLUGIN_PARTITION=YES \
          -DPLUGIN_DUCKDB=NO \
          -DPLUGIN_ROCKSDB=NO \
          -DPLUGIN_SPHINX=NO \
          -DPLUGIN_TOKUDB=NO \
          -DPLUGIN_AUTH_GSSAPI=NO \
          -DPLUGIN_AUTH_GSSAPI_CLIENT=OFF \
          -DPLUGIN_AUTH_PAM=NO \
          -DPLUGIN_AUTH_PAM_V1=NO \
          -DPLUGIN_CRACKLIB_PASSWORD_CHECK=NO \
          -DWITH_ASAN=OFF \
          -DWITH_EMBEDDED_SERVER=ON \
          -DWITH_EXTRA_CHARSETS=complex \
          -DWITH_INNODB_BZIP2=OFF \
          -DWITH_INNODB_LZ4=OFF \
          -DWITH_INNODB_LZMA=ON \
          -DWITH_INNODB_LZO=OFF \
          -DWITH_INNODB_SNAPPY=OFF \
          -DWITH_ROCKSDB_BZIP2=OFF \
          -DWITH_ROCKSDB_JEMALLOC=OFF \
          -DWITH_ROCKSDB_LZ4=OFF \
          -DWITH_ROCKSDB_ZSTD=OFF \
          -DWITH_ROCKSDB_SNAPPY=OFF \
          -DWITH_JEMALLOC=NO \
          -DWITH_LIBARCHIVE=system \
          -DWITH_LIBNUMA=NO \
          -DWITH_LIBWRAP=OFF \
          -DWITH_LIBWSEP=OFF \
          -DWITH_MARIABACKUP=ON \
          -DWITH_PCRE=system \
          -DWITH_PIC=ON \
          -DWITH_READLINE=ON \
          -DWITH_SYSTEMD=no \
          -DWITH_SSL=system \
          -DWITH_VALGRIND=OFF \
          -DWITH_ZLIB=system \
          -DSKIP_TESTS=ON
    - name: Install
      runs: |
        # Ninja otherwise sizes its worker pool from the host's CPU count,
        # which can exhaust a memory-limited bubblewrap builder.
        DESTDIR="${{targets.destdir}}" ninja -j8 install
    - name: Remove extras
      runs: |
        rm -rf "${{targets.destdir}}"/usr/local/mysql/sql-bench/
        rm -rf "${{targets.destdir}}"/usr/local/mysql/mysql-test/

        rm -rf "${{targets.destdir}}"/usr/bin/mariadb_config
        rm -rf "${{targets.destdir}}"/usr/bin/mysql_config
        rm -rf "${{targets.destdir}}"/usr/include/mysql/errmsg.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/ma_list.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/ma_pvio.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/ma_tls.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mariadb/ma_io.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mariadb_com.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mariadb_ctype.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mariadb_dyncol.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mariadb_stmt.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mariadb_version.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mysql.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mysql/client_plugin.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mysql/plugin_auth.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mysql/plugin_auth_common.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mysql_version.h
        rm -rf "${{targets.destdir}}"/usr/include/mysql/mysqld_error.h
        rm -rf "${{targets.destdir}}"/usr/lib/${{package.name}}/plugin/dialog.so
        rm -rf "${{targets.destdir}}"/usr/lib/${{package.name}}/plugin/mysql_clear_password.so
        rm -rf "${{targets.destdir}}"/usr/lib/${{package.name}}/plugin/sha256_password.so
        rm -rf "${{targets.destdir}}"/usr/lib/${{package.name}}/plugin/caching_sha2_password.so
        rm -rf "${{targets.destdir}}"/usr/lib/${{package.name}}/plugin/client_ed25519.so
        rm -rf "${{targets.destdir}}"/usr/lib/libmysqlclient.so
        rm -rf "${{targets.destdir}}"/usr/lib/libmysqlclient_r.so
        rm -rf "${{targets.destdir}}"/usr/lib/libmariadb.so*
        rm -rf "${{targets.destdir}}"/usr/lib/pkgconfig/libmariadb.pc
    - name: 'make mysql data dir '
      runs: |
        mkdir -p "${{targets.destdir}}"/var/lib/mysql
    - uses: strip
  subpackages:
    - name: ${{package.name}}-dev
      description: headers for mariadb
      pipeline:
        - uses: split/dev
      test:
        environment:
          contents:
            # Wolfi's newer versioned packages also provide these names.
            packages:
              - ${{package.name}}-dev=${{package.full-version}}
        pipeline:
          - # Strict getopt ordering requires apk's direct applet entry point.
            needs:
              packages:
                - busybox
                - apk-tools
                - ldd-check
            runs: |
              ln -s "$(command -v apk)" /tmp/apk_info
              sed 's|apk info |/tmp/apk_info |g' "$(command -v ldd-check)" > /tmp/ldd-check
              sh /tmp/ldd-check --packages="$(basename '${{targets.contextdir}}')"
          - needs:
              packages:
                - pkgconf
            runs: |
              /tmp/apk_info -qL ${{package.name}}-dev | while read -r path; do
                case "$path" in
                  *.pc) name=${path##*/}; pkgconf --exists "${name%.pc}" ;;
                esac
              done
    - name: ${{package.name}}-doc
      pipeline:
        - uses: split/manpages
      test:
        environment:
          contents:
            packages:
              - ${{package.name}}-doc=${{package.full-version}}
        pipeline:
          - needs:
              packages:
                - busybox
                - apk-tools
                - groff
            runs: |
              ln -s "$(command -v apk)" /tmp/apk_info
              /tmp/apk_info -qL ${{package.name}}-doc > /tmp/doc-files
              grep '^usr/share/man/.*\.[1-9]\(.gz\)\?$' /tmp/doc-files > /tmp/man-pages
              cd /usr/share/man
              while read -r path; do
                case "$path" in
                  *.gz) gzip -dc "/$path" ;;
                  *) cat "/$path" ;;
                esac | /usr/bin/preconv -e UTF-8 | /usr/bin/tbl |
                  /usr/bin/troff -Tutf8 -mandoc | /usr/bin/grotty > /dev/null
              done < /tmp/man-pages
    - name: ${{package.name}}-bench
      pipeline:
        - runs: |
            mkdir -p "${{targets.subpkgdir}}"/usr/share/
            mv "${{targets.destdir}}"/usr/sql-bench "${{targets.subpkgdir}}"/usr/share
    - name: ${{package.name}}-backup
      dependencies:
        runtime:
          - ${{package.name}}-dump=${{package.full-version}}
      pipeline:
        - runs: |
            mkdir -p "${{targets.subpkgdir}}"/usr/bin
            mv "${{targets.destdir}}"/usr/bin/mariabackup \
              "${{targets.destdir}}"/usr/bin/mariadb-backup \
              "${{targets.destdir}}"/usr/bin/mbstream \
              "${{targets.subpkgdir}}"/usr/bin/
    - name: ${{package.name}}-dump
      description: Database dump tools for mariadb
      pipeline:
        - runs: |
            mkdir -p "${{targets.subpkgdir}}"/usr/bin
            mv "${{targets.destdir}}"/usr/bin/mariadb-dump \
              "${{targets.destdir}}"/usr/bin/mysqldump \
              "${{targets.destdir}}"/usr/bin/mariadb-dumpslow \
              "${{targets.destdir}}"/usr/bin/mysqldumpslow \
              "${{targets.subpkgdir}}"/usr/bin/
      test:
        environment:
          contents:
            packages:
              - ${{package.name}}-dump=${{package.full-version}}
        pipeline:
          - needs:
              packages:
                - busybox
            runs: |
              for command in mariadb-dump mysqldump; do
                "$command" --version | grep -F '${{package.version}}'
              done
              for command in mariadb-dump mysqldump mariadb-dumpslow mysqldumpslow; do
                "$command" --help
              done
    - name: ${{package.name}}-client
      pipeline:
        - runs: |
            mkdir -p "${{targets.subpkgdir}}"/usr/bin
            mv "${{targets.destdir}}"/usr/bin/mariadb "${{targets.subpkgdir}}"/usr/bin/
    - name: ${{package.name}}-embedded
      description: Emedded library for mariadb
      pipeline:
        - runs: |
            mkdir -p ${{targets.subpkgdir}}/usr/bin/
            mv "${{targets.destdir}}"/usr/bin/mariadb-embedded  "${{targets.subpkgdir}}"/usr/bin
    - name: ${{package.name}}-test
      pipeline:
        - runs: |
            mkdir -p "${{targets.subpkgdir}}"/usr
            mv "${{targets.destdir}}"/usr/mariadb-test "${{targets.subpkgdir}}"/usr/
      test:
        environment:
          contents:
            packages:
              - ${{package.name}}-test=${{package.full-version}}
        pipeline:
          - # Strict getopt ordering requires apk's direct applet entry point.
            needs:
              packages:
                - busybox
                - apk-tools
                - ldd-check
            runs: |
              ln -s "$(command -v apk)" /tmp/apk_info
              sed 's|apk info |/tmp/apk_info |g' "$(command -v ldd-check)" > /tmp/ldd-check
              sh /tmp/ldd-check --packages="$(basename '${{targets.contextdir}}')"
  test:
    environment:
      contents:
        packages:
          - ${{package.name}}=${{package.full-version}}
          - ${{package.name}}-client=${{package.full-version}}
      environment:
        DBDATA: /var/lib/mysql
        MYSQL_TEST_DB: test_db
        MYSQL_TEST_USER: test_user
        MYSQL_TEST_PASS: test_pass
    pipeline:
      - # Strict getopt ordering requires apk's direct applet entry point.
        needs:
          packages:
            - busybox
            - apk-tools
            - ldd-check
        runs: |
          ln -s "$(command -v apk)" /tmp/apk_info
          sed 's|apk info |/tmp/apk_info |g' "$(command -v ldd-check)" > /tmp/ldd-check
          sh /tmp/ldd-check --packages="$(basename '${{targets.contextdir}}')"
      - name: No PAM plugin or setuid helper, and nothing loads libpam
        runs: |
          for path in /usr/lib/mariadb/plugin/auth_pam.so /usr/lib/mariadb/plugin/auth_pam_v1.so \
            /usr/lib/mariadb/plugin/auth_pam_tool_dir; do
            if [ -e "$path" ]; then
              echo "MariaDB installed $path" >&2
              exit 1
            fi
          done
          test -x /usr/bin/mariadbd
          if grep -l 'libpam\.so' /usr/bin/mariadbd /usr/lib/mariadb/plugin/*.so; then
            echo 'MariaDB names libpam' >&2
            exit 1
          fi
      - runs: |
          aria_chk --version
          aria_dump_log --version
          aria_pack --version
          aria_read_log --version
          innochecksum --version
          mariadb-access --version
          mariadb-admin --version
          mariadb-binlog --version
          mariadb-check --version
          mariadb-client-test --help
          mariadb-client-test-embedded --help
          mariadb-find-rows --help
          mariadb-import --version
          mariadb-install-db --version
          mariadb-plugin --version
          mariadb-show --version
          mariadb-slap --version
          mariadb-test --version
          mariadb-test-embedded --version
          mariadb-tzinfo-to-sql --version
          mariadb-waitpid --version
          mariadbd --version
          mariadbd-multi --version
          my_print_defaults --version
          myisamchk --version
          myisamlog -?
          myisampack --version
          mysqlaccess --version
          perror --version
          replace -v
          resolve_stack_dump --version
          resolveip --version
          aria_chk --help
          aria_dump_log --help
          aria_pack --help
          aria_read_log --help
          innochecksum --help
          mariadb-access --help
          mariadb-admin --help
          mariadb-binlog --help
          mariadb-check --help
          mariadb-import --help
          mariadb-plugin --help
          mariadb-show --help
          mariadb-slap --help
          mariadb-test --help
          mariadb-test-embedded --help
          mariadb-tzinfo-to-sql --help
          mariadb-waitpid --help
          mariadbd --help
          mariadbd-multi --help
          my_print_defaults --help
          myisamchk --help
          myisampack --help
          mysql_find_rows --help
          mysql_plugin --help
          mysql_tzinfo_to_sql --help
          mysql_waitpid --help
          mysqlaccess --help
          perror --help
          replace -h
          resolveip --help
      - name: Test the database server
        runs: |
          set -e  # Fail fast
          mkdir -p "$DBDATA" /var/tmp /run/mysqld

          mariadb-install-db --user=root --datadir="$DBDATA" --auth-root-authentication-method=normal

          mariadbd --user=root --datadir="$DBDATA" --skip-networking=0 > /dev/null 2>&1 &

          mariadb-admin --wait=30 ping

          # NOTE: This test uses a mix of files and inline SQL.
          # This is because of shell quoting issues.

          cat << EOF > /tmp/01.sql
          -- Create test database
          CREATE DATABASE $MYSQL_TEST_DB;

          -- Create test user with privileges
          CREATE USER '$MYSQL_TEST_USER'@'localhost';
          SET PASSWORD FOR '$MYSQL_TEST_USER'@'localhost' = PASSWORD('$MYSQL_TEST_PASS');
          GRANT ALL ON $MYSQL_TEST_DB.* TO '$MYSQL_TEST_USER'@'localhost';
          EOF
          mariadb -u root < /tmp/01.sql

          cat << EOF > /tmp/02.sql
          -- Create test table and insert data
          CREATE TABLE test_table (id INT PRIMARY KEY, name VARCHAR(50));
          INSERT INTO test_table VALUES (1, 'test1'), (2, 'test2');
          SELECT * FROM test_table WHERE id=1;
          EOF
          mariadb -u $MYSQL_TEST_USER -p$MYSQL_TEST_PASS $MYSQL_TEST_DB < /tmp/02.sql | grep -F "test1"

          # Test mysqldump
          mariadb-dump -u root $MYSQL_TEST_DB > /tmp/backup.sql
          # Verify backup contains expected content
          grep -F "CREATE TABLE" /tmp/backup.sql | grep -F "test_table"
          grep -F "INSERT INTO" /tmp/backup.sql | grep -F "test_table"

          cat << EOF > /tmp/03.sql
          -- Test character set functionality
          SHOW VARIABLES LIKE 'character_set_server';
          SHOW VARIABLES LIKE 'collation_server';
          EOF
          mariadb -u root < /tmp/03.sql > /tmp/03.out
          grep -F "utf8mb4" /tmp/03.out
          grep -F "utf8mb4_general_ci" /tmp/03.out

          # Test InnoDB status
          mariadb -u root -e "SHOW ENGINE INNODB STATUS\G" | grep -F "INNODB MONITOR OUTPUT"
          mariadb -u root -e "SHOW VARIABLES LIKE 'innodb_file_per_table';" | grep -F "ON"

          # Verify essential plugins are loaded
          mariadb -u root -e "SHOW PLUGINS;" | grep -F "InnoDB"
          mariadb -u root -e "SHOW PLUGINS;" | grep -F "MEMORY"
          mariadb -u root -e "SHOW PLUGINS;" | grep -F "MyISAM"

          # Test server variables and status
          mariadb-admin extended-status | grep -F "Uptime"
          mariadb-admin variables | grep -F "version"
          mariadb -u root -e "SHOW VARIABLES LIKE 'max_connections';"

          # Enable general log temporarily
          mariadb -u root -e "SET GLOBAL general_log = 'ON';"
          mariadb -u root -e "SHOW VARIABLES LIKE 'general_log';" | grep -F "ON"
          mariadb -u root -e "SET GLOBAL general_log = 'OFF';"
changes:
  - what: 'MariaDB''s newest stable release, the highest-versioned GitHub release that is not a prerelease, as one unversioned package set: mariadb, mariadb-client, mariadb-dump and the rest.'
    why: Wolfi keeps one recipe for MariaDB's newest series and renames it each quarter, release candidates included (13.0.1, then 13.1.1). Forms need one name that moves only to stable releases; mariadb-init upgrades the data when it does.
    evidence:
      - package.yaml
  - what: Build with PLUGIN_AUTH_PAM=NO and PLUGIN_AUTH_PAM_V1=NO, and drop linux-pam-dev.
    why: The PAM plugins brought libpam and the setuid-root auth_pam_tool. Werewolf's MariaDB authenticates local users by unix_socket and others by password, never through PAM.
    evidence:
      - package.yaml
  - what: Drop the OCI entrypoint subpackage with its pwgen dependency, and the self-provides and virtual-package tests that an unversioned name makes redundant.
    why: Werewolf leashes mariadbd as a service rather than running Wolfi's container entrypoint, and the aliases now name the real packages.
    evidence:
      - package.yaml
  - evidence:
      - package.yaml
    what: 'Build MariaDB without PAM: no auth_pam plugins, no setuid-root auth_pam_tool, and nothing that loads libpam.'
    why: Establish the package's minimized policy.
    claims:
      - minimized
replaces:
  - mariadb-13.1.yaml
drop-when: Wolfi tracks MariaDB's stable releases under stable package names and builds without PAM; review compatibility before retiring this context.
