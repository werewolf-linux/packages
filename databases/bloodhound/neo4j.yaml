# Neo4j 4.4 for werewolf's bloodhound form. BloodHound's image calls
# db.indexes, db.createIndex and db.createUniquePropertyConstraint,
# which Neo4j 5 removed, and Wolfi's packages start at 2025. This is the
# community tarball BloodHound's compose pins, without its shell scripts.
# JNA's library is unpacked beside it: a temporary directory is noexec,
# so Neo4j cannot unpack the library there.
package:
  name: neo4j-4.4
  version: "4.4.48"
  epoch: 2
  description: Neo4j 4.4 community, which BloodHound's image still speaks
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - openjdk-11-default-jvm

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - unzip

pipeline:
  - uses: fetch
    with:
      uri: https://dist.neo4j.org/neo4j-community-${{package.version}}-unix.tar.gz
      expected-sha256: "fa4f64047cf6018fa6faa202c830d3ff6c8d2154ae8a3313c920fc504baa7ab2"

  - runs: |
      src=.
      if [ -d neo4j-community-${{package.version}} ]; then
        src=neo4j-community-${{package.version}}
      fi
      test -d "$src/lib"
      d=${{targets.destdir}}/var/lib/neo4j
      jna=${{targets.destdir}}/usr/lib/jna
      mkdir -p "$d/plugins" "$d/certificates" "$jna/aarch64" "$jna/x86_64"
      cp -a "$src/lib" "$d/"
      cp "$src/LICENSE.txt" "$src/LICENSES.txt" "$src/NOTICE.txt" "$d/"
      : >"$d/plugins/.keep"
      : >"$d/certificates/.keep"
      unzip -q -j "$src/lib/jna-5.9.0.jar" \
        com/sun/jna/linux-aarch64/libjnidispatch.so -d "$jna/aarch64"
      unzip -q -j "$src/lib/jna-5.9.0.jar" \
        com/sun/jna/linux-x86-64/libjnidispatch.so -d "$jna/x86_64"
      chmod 755 "$jna/aarch64/libjnidispatch.so" "$jna/x86_64/libjnidispatch.so"
      find "$d" -type d -exec chmod 755 {} +
      find "$d" -type f -exec chmod 644 {} +
