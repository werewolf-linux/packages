# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  github:
    identifier: apache/solr
    strip-prefix: releases/solr/
    use-tag: true
melange:
  # Only the application and our bootstrap. Wolfi's solr package also depends on
  # Bash, BusyBox, and OpenJDK 21; none belongs in this package or its runtime deps.
  package:
    name: solr
    version: "10.1.0"
    epoch: 0
    description: Apache Solr, directly launched with hardened OpenJDK 27
    copyright:
      - license: Apache-2.0
    dependencies:
      runtime:
        - openjdk-27-jre>=27.0.0-r2002
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
        - ca-certificates-bundle
        - go-1.27
  pipeline:
    - uses: fetch
      with:
        uri: https://archive.apache.org/dist/solr/solr/${{package.version}}/solr-${{package.version}}-slim.tgz
        expected-sha256: "046e0974ab27c0403a4e7bed2d00a394470a9e702933604b051c8f7cbff2bbe5"
        strip-components: 1
    - runs: |
        dest=${{targets.destdir}}/usr/lib/solr
        mkdir -p "$dest"
        cp -a server lib licenses LICENSE.txt NOTICE.txt "$dest/"
        # The shell launchers, Docker entrypoints and bundled examples stay out.
        CGO_ENABLED=0 go build -buildmode=pie -trimpath -ldflags='-s -w' -o "$dest/setup" setup.go
        install -m644 log4j2.xml "$dest/log4j2.xml"
  test:
    pipeline:
      - name: Installed bootstrap preserves existing configuration
        runs: |
          /usr/lib/solr/setup
          test -s /data/svc/solr/home/solr.xml
          test -d /data/svc/solr/home/configsets
          printf '\n<!-- retained by package test -->\n' >>/data/svc/solr/home/solr.xml
          cp /data/svc/solr/home/solr.xml /tmp/custom-solr.xml
          /usr/lib/solr/setup
          cmp /tmp/custom-solr.xml /data/svc/solr/home/solr.xml
changes:
  - what: Only the application and our bootstrap. Wolfi's solr package also depends on Bash, BusyBox, and OpenJDK 21; none belongs in this package or its runtime deps.
    why: Package the server without the shell-based launcher, bundled JVM or service manager.
    evidence:
      - package.yaml
    claims:
      - minimized
replaces:
  - solr.yaml
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
