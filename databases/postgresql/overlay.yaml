# Checked changes to the captured Wolfi recipe. See docs/overlays.md.
title: PostgreSQL
sources:
- https://github.com/postgres/postgres.git
context-edits:
- path: per-version-dirs.patch
  replace:
  - old: /usr/lib/postgresql${baseline.feature}
    new: /usr/lib/postgresql${lock.feature}
  - old: $(pkgincludedir)/${baseline.feature}/server
    new: $(pkgincludedir)/${lock.feature}/server
prepared-edits:
- path: src/Makefile.global.in
  replace:
  - old: /usr/lib/postgresql${baseline.feature}
    new: /usr/lib/postgresql${lock.feature}
  - old: $(pkgincludedir)/${baseline.feature}/server
    new: $(pkgincludedir)/${lock.feature}/server
checks:
- path: [pipeline, uses=git-checkout]
  expect:
    uses: git-checkout
    with:
      expected-commit: ${lock.source_commit}
      repository: https://github.com/postgres/postgres
      tag: REL_${{vars.mangled-package-version}}
- path: [pipeline]
  shape:
  - uses=git-checkout
  - uses=patch
  - uses=autoconf/configure
  - uses=autoconf/make
  - uses=autoconf/make-install
  - runs
  - name=Build PL/Perl transform modules
  - uses=strip
- path: [subpackages]
  shape:
  - name=${{package.name}}-dev
  - name=${{package.name}}-client-base
  - name=${{package.name}}-client
  - name=${{package.name}}-pgadmin-compat
  - name=${{package.name}}-contrib-base
  - name=${{package.name}}-contrib
  - name=libpq-${baseline.feature}
  - name=libecpg-${baseline.feature}
  - name=libecpg-${baseline.feature}-dev
  - name=ecpg-${baseline.feature}
  - name=${{package.name}}-oci-entrypoint-base
  - name=${{package.name}}-oci-entrypoint
  - name=postgresql-${{vars.major-version}}-oci-entrypoint-compat
  - name=${{package.name}}-plperl
  - name=${{package.name}}-base
  - name=py${{range.key}}-${{vars.pypi-package}}-${{vars.major-version}}
- path: [environment, environment, CONFIGURE_FLAGS]
  expect: |
    --bindir=/usr/libexec/${{vars.mangled-package-name}} \
    --datadir=/usr/share/${{vars.mangled-package-name}} \
    --docdir=/usr/share/doc/${{vars.mangled-package-name}} \
    --mandir=/usr/share/${{vars.mangled-package-name}}/man \
    --with-openssl \
    --with-libedit-preferred \
    --with-uuid=e2fs \
    --with-libxml \
    --with-libxslt \
    --with-icu \
    --with-lz4 \
    --with-zstd \
    --with-gssapi \
    --with-ldap \
    --with-llvm \
    --with-pam \
    --enable-thread-safety
- path: [pipeline, uses=autoconf/configure, with, opts]
  expect: $CONFIGURE_FLAGS --with-perl
- path: [pipeline, '1']
  expect:
    uses: patch
    with:
      patches: |
        per-version-dirs.patch
        ssl-groups-fips-tolerant-default.patch
edits:
- path: [var-transforms, '0']
  expect:
    from: ${{package.name}}
    match: '-'
    replace: ''
    to: mangled-package-name
  set:
    from: ${{package.version}}
    match: '^(\d+).*'
    replace: postgresql$1
    to: mangled-package-name
- path: [package, name]
  replace:
  - old: ${upstream.name}
    new: postgresql
- path: [package, dependencies, provides]
  expect:
  - postgresql=${{package.full-version}}
  delete: true
- path: [package, dependencies, runtime]
  remove:
  - ecpg=${{package.full-version}}
- path: [data]
  delete: true
  exists: true
- path: [environment, environment, CONFIGURE_FLAGS]
  replace:
  - old: |
      --with-pam \
    new: |
      --without-pam \
  - old: |
      --with-gssapi \
      --with-ldap \
    new: |
      --without-gssapi \
      --without-ldap \
- path: [environment, contents, packages]
  remove:
  - curl
  - execline-dev
  - krb5-dev
  - linux-pam-dev
  - openldap-dev
  - perl-dev
  - py3-supported-build-base-dev
- path: [pipeline, name=Build PL/Perl transform modules]
  delete: true
- path: [pipeline, uses=autoconf/configure, with, opts]
  replace:
  - old: $CONFIGURE_FLAGS --with-perl
    new: $CONFIGURE_FLAGS --without-perl --without-python --without-tcl
- path: [subpackages, 'name=py${{range.key}}-${{vars.pypi-package}}-${{vars.major-version}}']
  delete: true
- path: [subpackages, 'name=${{package.name}}-plperl']
  delete: true
- path: [subpackages, 'name=postgresql-${{vars.major-version}}-oci-entrypoint-compat']
  delete: true
- path: [subpackages, 'name=${{package.name}}-oci-entrypoint']
  delete: true
- path: [subpackages, 'name=${{package.name}}-oci-entrypoint-base']
  delete: true
- path: [subpackages, 'name=ecpg-${baseline.feature}']
  delete: true
- path: [subpackages, 'name=libecpg-${baseline.feature}-dev']
  delete: true
- path: [subpackages, 'name=libecpg-${baseline.feature}']
  delete: true
- path: [subpackages, 'name=libpq-${baseline.feature}']
  delete: true
- path: [subpackages]
  append:
  - name: libpq
    description: PostgreSQL libraries
    pipeline:
    - runs: |
        mkdir -p ${{targets.subpkgdir}}/usr/lib
        mv ${{targets.destdir}}/usr/lib/libpq.so* ${{targets.subpkgdir}}/usr/lib/
    test:
      pipeline:
      - uses: test/tw/ldd-check
  - name: libecpg
    description: Embedded PostgreSQL libraries
    pipeline:
    - runs: |
        mkdir -p ${{targets.subpkgdir}}/usr/lib
        mv ${{targets.destdir}}/usr/lib/libecpg.so* ${{targets.subpkgdir}}/usr/lib/
        mv ${{targets.destdir}}/usr/lib/libecpg_compat.so* ${{targets.subpkgdir}}/usr/lib/
        mv ${{targets.destdir}}/usr/lib/libpgtypes.so* ${{targets.subpkgdir}}/usr/lib/
    test:
      pipeline:
      - uses: test/tw/ldd-check
  - name: libecpg-dev
    description: Embedded PostgreSQL libraries (development files)
    dependencies:
      runtime:
      - libecpg=${{package.full-version}}
    pipeline:
    - runs: |
        mkdir -p ${{targets.subpkgdir}}/usr/include/postgresql
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/ecpg*.h ${{targets.subpkgdir}}/usr/include/postgresql/
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/postgresql/informix ${{targets.subpkgdir}}/usr/include/postgresql/
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/pgtypes*.h ${{targets.subpkgdir}}/usr/include/postgresql/
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/sql3types.h ${{targets.subpkgdir}}/usr/include/postgresql/
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/sqlca.h ${{targets.subpkgdir}}/usr/include/postgresql/
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/sqlda*.h ${{targets.subpkgdir}}/usr/include/postgresql/

        mkdir -p ${{targets.subpkgdir}}/usr/lib/pkgconfig
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/lib/libecpg.* ${{targets.subpkgdir}}/usr/lib/
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/lib/libpgtypes.* ${{targets.subpkgdir}}/usr/lib/
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/lib/pkgconfig/libecpg.pc ${{targets.subpkgdir}}/usr/lib/pkgconfig/
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/lib/pkgconfig/libecpg_compat.pc ${{targets.subpkgdir}}/usr/lib/pkgconfig/
        mv ${{targets.outdir}}/${{package.name}}-dev/usr/lib/pkgconfig/libpgtypes.pc ${{targets.subpkgdir}}/usr/lib/pkgconfig/
    test:
      environment:
        contents:
          packages:
          - pkgconf
      pipeline:
      - uses: test/tw/devpackage
      - uses: test/tw/ldd-check
      - uses: test/pkgconf
      - runs: |
          # Test that key header files are present
          test -f /usr/include/postgresql/ecpg_config.h
          test -f /usr/include/postgresql/ecpglib.h
          test -f /usr/include/postgresql/pgtypes.h
          test -f /usr/include/postgresql/sqlca.h

          # Test that pkgconfig files are present and working
          pkg-config --exists libecpg
          pkg-config --exists libecpg_compat
          pkg-config --exists libpgtypes

          # Test that static libraries are present
          test -f /usr/lib/libecpg.a
          test -f /usr/lib/libpgtypes.a
  - name: ecpg
    description: Embedded PostgreSQL SQL preprocessor for C programs
    pipeline:
    - runs: |
        mkdir -p ${{targets.subpkgdir}}/usr/bin/
        mv ${{targets.destdir}}/usr/libexec/${{vars.mangled-package-name}}/ecpg ${{targets.subpkgdir}}/usr/bin/
    test:
      environment:
        contents:
          packages:
          - libecpg-dev=${{package.full-version}}
      pipeline:
      - uses: test/tw/ldd-check
      - runs: ecpg --help
      - runs: |
          cat <<"EOF" >test.pgc
          /* test.pgc */
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          EXEC SQL INCLUDE sqlca;

          int main() {
              EXEC SQL BEGIN DECLARE SECTION;
              const char *db = "testdb";
              const char *user = "postgres";
              int id;
              char name[100];
              EXEC SQL END DECLARE SECTION;

              EXEC SQL CONNECT TO :db USER :user;

              if (sqlca.sqlcode < 0) {
                  fprintf(stderr, "Connection failed: %s\n", sqlca.sqlerrm.sqlerrmc);
                  exit(1);
              }

              EXEC SQL CREATE TABLE IF NOT EXISTS demo (id INT, name TEXT);
              EXEC SQL INSERT INTO demo (id, name) VALUES (1, 'chainguard');
              EXEC SQL COMMIT;

              EXEC SQL DECLARE cur CURSOR FOR SELECT id, name FROM demo;
              EXEC SQL OPEN cur;

              while (1) {
                  EXEC SQL FETCH cur INTO :id, :name;
                  if (sqlca.sqlcode != 0) break;
                  printf("Row: id = %d, name = %s\n", id, name);
              }

              EXEC SQL CLOSE cur;
              EXEC SQL COMMIT;
              EXEC SQL DISCONNECT;

              return 0;
          }
          EOF
          ecpg -I /usr/include/postgresql test.pgc
  before: '6'
- path: [subpackages, 'name=${{package.name}}-contrib', dependencies, provides]
  remove:
  - postgresql-contrib=${{package.full-version}}
- path: [subpackages, 'name=${{package.name}}-pgadmin-compat']
  delete: true
- path: [subpackages, 'name=${{package.name}}-client', dependencies, provides]
  remove:
  - postgresql-client=${{package.full-version}}
- path: [subpackages, 'name=${{package.name}}-client', test]
  expect:
    pipeline:
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: postgresql-client
        real-pkg-name: ${{subpkg.name}}
  set:
    pipeline:
    - name: Unversioned PostgreSQL client identity
      runs: |
        test "$(apk list --installed postgresql-client 2>/dev/null | awk '{print $1}')" = "postgresql-client-${{package.full-version}}"
        psql --version | grep -F "${{package.version}}"
- path: [subpackages, 'name=${{package.name}}-dev', dependencies, provides]
  remove:
  - postgresql-dev=${{package.full-version}}
- path: [subpackages, 'name=${{package.name}}-dev', dependencies, runtime]
  remove:
  - libpq-${baseline.feature}
  - libecpg-${baseline.feature}-dev
  append:
  - libpq
  - libecpg-dev
- path: [subpackages, 'name=${{package.name}}-dev', test, pipeline, uses=test/tw/ldd-check, with, packages]
  replace:
  - old: ${upstream.name}-dev
    new: postgresql-dev
- path: [test, pipeline]
  append:
  - name: Peer, SCRAM, TLS, JIT, extensions and backup/restore consumers
    needs:
      packages:
      - postgresql-dev
      - postgresql-contrib
      - openssl
      - shadow
    runs: |
      cat > /tmp/postgresql-consumers.sh <<'WEREWOLF_POSTGRESQL_CONSUMERS'
      ${file:tests/consumers.sh}WEREWOLF_POSTGRESQL_CONSUMERS
      sh /tmp/postgresql-consumers.sh
- path: [test, pipeline, name=Test krb5 config parameter exists]
  delete: true
test-edits:
- path: [test, pipeline]
  prepend:
  - name: Initialize test account databases
    runs: |
      chmod 755 /
      for file in /etc/shadow /etc/gshadow; do
        test -f "$file" || install -m600 /dev/null "$file"
        chmod 600 "$file"
      done
- path: [test, pipeline]
  join:
    from: name=Test database creation
    name: Database lifecycle and consumer tests
    prefix: |
      trap 'sudo -u "$PGUSER" pg_ctl -D "$PGDATA" -m immediate stop >/dev/null 2>&1 || true' EXIT
