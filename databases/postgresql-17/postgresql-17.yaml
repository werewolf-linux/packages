package:
  name: postgresql-17
  version: "17.11"
  epoch: 0
  description: PostgreSQL 17 with LLVM JIT and local/SCRAM authentication
  copyright:
  - license: BSD-3-Clause
  dependencies:
    provides:
    - postgresql=${{package.full-version}}
    runtime:
    - ${{package.name}}-base=${{package.full-version}}
    - tzdata
environment:
  contents:
    repositories:
    - https://packages.wolfi.dev/os
    keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
    - build-base
    - busybox
    - bison
    - flex
    - clang-19
    - llvm-19-dev
    - llvm-lld-19-dev
    - icu-dev
    - libedit-dev
    - util-linux-dev
    - libxml2-dev
    - libxslt-dev
    - lz4-dev
    - zstd-dev
    - zlib-dev
    - openssl-3.6-dev
    - openssl~3.6
    - patch
    - shadow
    - tzdata
vars:
  mangled-package-name: postgresql17
  major-version: '17'
  openssl-version: '3.6'
  client-tools: clusterdb createdb createuser dropdb dropuser pg_amcheck pg_basebackup pg_dump pg_dumpall pg_isready pg_receivewal pg_recvlogical pg_restore pg_verifybackup psql reindexdb vacuumdb
pipeline:
- uses: fetch
  with:
    uri: https://ftp.postgresql.org/pub/source/v${{package.version}}/postgresql-${{package.version}}.tar.bz2
    expected-sha256: "dd27f2b3c59e73ed14aa3324901242bf69a032a6347805f274e6260322d42979"
- runs: patch --batch --fuzz=0 -p1 < per-version-dirs.patch
- uses: autoconf/configure
  with:
    opts: --bindir=/usr/libexec/postgresql17 --datadir=/usr/share/postgresql17 --docdir=/usr/share/doc/postgresql17 --mandir=/usr/share/postgresql17/man --with-openssl --with-libedit-preferred --with-uuid=e2fs --with-libxml --with-libxslt --with-icu --with-lz4 --with-zstd --with-llvm --without-gssapi --without-ldap --without-pam --without-perl --without-python --without-tcl
- uses: autoconf/make
- runs: 'make install

    make -C contrib install

    useradd -M -s /bin/sh pgtest

    sh tests/consumers.sh

    '
- uses: autoconf/make-install
- uses: strip
subpackages:
- name: ${{package.name}}-dev
  pipeline:
  - uses: split/dev
  dependencies:
    provides:
    - postgresql-dev=${{package.full-version}}
    runtime:
    - ${{package.name}}
    - openssl-${{vars.openssl-version}}-dev
    - ${{package.name}}-client
    - libpq-17
    - libecpg-17-dev
  description: postgresql dev
- name: ${{package.name}}-client-base
  description: PostgreSQL client base
  pipeline:
  - runs: "mkdir -p ${{targets.subpkgdir}}/usr/libexec/${{vars.mangled-package-name}}\nfor binary in ${{vars.client-tools}}; do\n  mv ${{targets.destdir}}/usr/libexec/${{vars.mangled-package-name}}/${binary} ${{targets.subpkgdir}}/usr/libexec/${{vars.mangled-package-name}}/${binary}\ndone\n"
  dependencies:
    runtime:
    - libpq-17=${{package.full-version}}
- name: ${{package.name}}-client
  description: PostgreSQL client
  dependencies:
    runtime:
    - ${{package.name}}-client-base=${{package.full-version}}
    provides:
    - postgresql-client=${{package.full-version}}
  pipeline:
  - runs: "mkdir -p ${{targets.subpkgdir}}/usr/bin\nfor binary in ${{vars.client-tools}}; do\n  ln -sf /usr/libexec/${{vars.mangled-package-name}}/${binary} ${{targets.subpkgdir}}/usr/bin/${binary}\ndone\n"
- name: ${{package.name}}-contrib-base
  pipeline:
  - runs: 'make DESTDIR=${{targets.subpkgdir}} -C contrib install

      '
  description: Extension modules distributed with PostgreSQL
  dependencies:
    runtime:
    - libpq-17=${{package.full-version}}
- name: ${{package.name}}-contrib
  description: Extension modules distributed with PostgreSQL
  checks:
    disabled:
    - empty
  dependencies:
    runtime:
    - ${{package.name}}-contrib-base=${{package.full-version}}
    provides:
    - postgresql-contrib=${{package.full-version}}
- name: libpq-17
  description: PostgreSQL libraries
  pipeline:
  - runs: 'mkdir -p ${{targets.subpkgdir}}/usr/lib

      mv ${{targets.destdir}}/usr/lib/libpq.so* ${{targets.subpkgdir}}/usr/lib/

      '
  dependencies:
    provider-priority: 17
    provides:
    - libpq=${{package.full-version}}
- name: libecpg-17
  description: Embedded PostgreSQL libraries
  pipeline:
  - runs: 'mkdir -p ${{targets.subpkgdir}}/usr/lib

      mv ${{targets.destdir}}/usr/lib/libecpg.so* ${{targets.subpkgdir}}/usr/lib/

      mv ${{targets.destdir}}/usr/lib/libecpg_compat.so* ${{targets.subpkgdir}}/usr/lib/

      mv ${{targets.destdir}}/usr/lib/libpgtypes.so* ${{targets.subpkgdir}}/usr/lib/

      '
  dependencies:
    provider-priority: 17
    provides:
    - libecpg=${{package.full-version}}
- name: libecpg-17-dev
  description: Embedded PostgreSQL libraries (development files)
  dependencies:
    provider-priority: 17
    runtime:
    - libecpg-17=${{package.full-version}}
    provides:
    - libecpg-dev=${{package.full-version}}
  pipeline:
  - runs: 'mkdir -p ${{targets.subpkgdir}}/usr/include/postgresql

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/ecpg*.h ${{targets.subpkgdir}}/usr/include/postgresql/

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/postgresql/informix ${{targets.subpkgdir}}/usr/include/postgresql/

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/pgtypes*.h ${{targets.subpkgdir}}/usr/include/postgresql/

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/sql3types.h ${{targets.subpkgdir}}/usr/include/postgresql/

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/sqlca.h ${{targets.subpkgdir}}/usr/include/postgresql/

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/include/sqlda*.h ${{targets.subpkgdir}}/usr/include/postgresql/


      mkdir -p ${{targets.subpkgdir}}/usr/lib/pkgconfig

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/lib/libecpg.* ${{targets.subpkgdir}}/usr/lib/

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/lib/libpgtypes.* ${{targets.subpkgdir}}/usr/lib/

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/lib/pkgconfig/libecpg.pc ${{targets.subpkgdir}}/usr/lib/pkgconfig/

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/lib/pkgconfig/libecpg_compat.pc ${{targets.subpkgdir}}/usr/lib/pkgconfig/

      mv ${{targets.outdir}}/${{package.name}}-dev/usr/lib/pkgconfig/libpgtypes.pc ${{targets.subpkgdir}}/usr/lib/pkgconfig/

      '
- name: ecpg-17
  description: Embedded PostgreSQL SQL preprocessor for C programs
  dependencies:
    provider-priority: 17
    provides:
    - ecpg=${{package.full-version}}
  pipeline:
  - runs: 'mkdir -p ${{targets.subpkgdir}}/usr/bin/

      mv ${{targets.destdir}}/usr/libexec/${{vars.mangled-package-name}}/ecpg ${{targets.subpkgdir}}/usr/bin/

      '
- name: ${{package.name}}-base
  description: Base for PostgreSQL 17
  pipeline:
  - runs: "mkdir -p \"${{targets.subpkgdir}}\"\n\n# Move contents of main package to base package\nmv \"${{targets.destdir}}\"/* \"${{targets.subpkgdir}}\"\n\n# Create symlinks to binaries in execdir to bindir in main package\nexport bindir=\"${{targets.destdir}}/usr/bin\"\nexport execdir=\"/usr/libexec/${{vars.mangled-package-name}}\"\n\nmkdir -p \"${bindir}\"\n\ncd \"${{targets.subpkgdir}}/${execdir}\"\nfor binary in *; do\n  ln -sf \"${execdir}/${binary}\" \"${bindir}/${binary}\"\ndone\n"
  dependencies:
    runtime:
    - libpq-17=${{package.full-version}}
update:
  enabled: true
  github:
    identifier: postgres/postgres
    use-tag: true
    strip-prefix: REL_
    tag-filter: REL_17_
