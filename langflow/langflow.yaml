package:
  name: langflow
  version: "1.12.7"
  epoch: 0
  description: Langflow editor, API and local CPU inference on hardened Python
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.15>=3.15.0_git20261010-r2000
      - py3.15-onnxruntime=1.31.0-r0
      - libstdc++

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - build-base
      - clang-23
      - cmake
      - ninja-build
      - rust-1.98
      - ca-certificates-bundle
      - python-3.15
      - python-3.15-dev
      - uv
  environment:
    CC: clang
    CXX: clang++
    CMAKE_BUILD_PARALLEL_LEVEL: "4"
    PATH: /usr/lib/ninja-build/bin:/usr/local/bin:/usr/bin:/bin
    UV_PYTHON_DOWNLOADS: never
    UV_LINK_MODE: copy

pipeline:
  - uses: fetch
    with:
      uri: "https://files.pythonhosted.org/packages/8c/bb/2e16a28f3a8a0aa2ea5ad38fb58da3ec4a9dc9601078a30c4832286a9e68/langflow-1.12.7-py3-none-any.whl"
      expected-sha256: "75850b81bbb9db7de4c1754f0256bbdf8477229955373a31424785bd7293a713"
      extract: false

  - uses: fetch
    with:
      uri: "https://files.pythonhosted.org/packages/00/ed/f08b2f353d27e3527d3a2efefe6e95ecd8cd93a841b60c3a5d923170a458/langflow_base-1.12.7-py3-none-any.whl"
      expected-sha256: "7cecd028a65beea45c6eba73a3fd20c42545077cee493775b757324bc6b54c70"
      extract: false

  - uses: fetch
    with:
      uri: "https://files.pythonhosted.org/packages/6c/84/d33576724ec189c3bd9caf2db5c29a3371765350b8f487817165b3a1910b/lfx-1.12.7-py3-none-any.whl"
      expected-sha256: "90d652d9410a43e9dab6755614da8cbae05b3889d63132105ed62f024f5937b8"
      extract: false

  - runs: |
      # Use CP315 wheel tags. Only metadata's Python upper bounds are bypassed;
      # no CP314 binary or alternate interpreter is installed.
      python3.15 -m venv --system-site-packages /usr/lib/langflow
      # FastUUID's PyO3 0.26 supports Python through 3.14. Its documented
      # stable ABI mode is forward compatible; scope this to that build alone.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 /usr/lib/langflow/bin/python -m pip install \
        --no-deps --require-hashes --no-binary=fastuuid -r fastuuid-requirements.txt
      /usr/lib/langflow/bin/python -m pip install --no-deps --ignore-requires-python \
        --require-hashes --prefer-binary -r requirements.txt
      /usr/lib/langflow/bin/python -m pip install --no-deps --ignore-requires-python \
        langflow-1.12.7-py3-none-any.whl langflow_base-1.12.7-py3-none-any.whl lfx-1.12.7-py3-none-any.whl
      /usr/lib/langflow/bin/python -P -c 'import fastuuid; value=fastuuid.uuid4(); assert fastuuid.UUID(str(value)) == value'
      /usr/lib/langflow/bin/python port-python.py /usr/lib/langflow/lib/python3.15/site-packages
      # Import the complete API during packaging, so missing runtime providers
      # and interpreter compatibility errors fail before an image is shipped.
      /usr/lib/langflow/bin/python -P -c 'from langflow.main import setup_app; assert callable(setup_app)'
      cp server.py /usr/lib/langflow/server.py
      cp check-embedding.py /usr/lib/langflow/check-embedding.py
      PYTHONHASHSEED=0 /usr/lib/langflow/bin/python -m compileall \
        -q -f -j 1 --invalidation-mode checked-hash /usr/lib/langflow
      # Remove installer entrypoints and their implementations from the runtime.
      rm -rf /usr/lib/langflow/lib/python3.15/site-packages/pip \
        /usr/lib/langflow/lib/python3.15/site-packages/pip-*.dist-info
      rm -f /usr/lib/langflow/bin/activate* /usr/lib/langflow/bin/pip*
      mkdir -p ${{targets.destdir}}/usr/lib
      cp -a /usr/lib/langflow ${{targets.destdir}}/usr/lib/langflow

update:
  enabled: false
