# Checked changes to the captured Wolfi recipe. See docs/overlays.md.
title: libvips
sources:
- https://github.com/libvips/libvips.git
checks:
- path: [pipeline, uses=git-checkout]
  expect:
    uses: git-checkout
    with:
      repository: https://github.com/libvips/libvips
      expected-commit: ${lock.source_commit}
      tag: v${{package.version}}
- path: [pipeline]
  shape:
  - uses=git-checkout
  - uses=meson/configure
  - uses=meson/compile
  - uses=meson/install
  - uses=strip
- path: [subpackages]
  shape:
  - name=libvips-dev
  - name=libvips-doc
- path: [pipeline, uses=meson/configure, with, opts]
  expect: -Dheif=enabled
edits:
- path: [package, dependencies]
  absent: true
  set:
    provides:
    - libvips-hardened=${{package.full-version}}
- path: [environment, contents, packages]
  expect:
  - bubblewrap
  - build-base
  - busybox
  - cmake
  - expat-dev
  - freetype-dev
  - glib-dev
  - glibc-2.44-dev
  - libexif-dev
  - libheif-dev
  - libjpeg-turbo-dev
  - librsvg-dev
  - meson
  set:
  - build-base
  - busybox
  - expat-dev
  - glib-dev
  - glibc-2.44-dev
  - libexif-dev
  - libjpeg-turbo-dev
  - libpng-dev
  - libwebp-dev
  - lcms2-dev
  - meson
  - zlib-dev
- path: [pipeline]
  append:
  - name: Omit CLI manpages
    runs: |
      rm -rf "${{targets.destdir}}/usr/share/man"
- path: [pipeline, uses=meson/configure, with, opts]
  replace:
  - old: -Dheif=enabled
    new: -Dauto_features=disabled -Dheif=disabled -Dmodules=disabled -Dexif=enabled -Djpeg=enabled -Dpng=enabled
      -Dwebp=enabled -Dlcms=enabled -Dzlib=enabled -Dnsgif=true -Dppm=false -Danalyze=false -Dradiance=false -Dcplusplus=false
      -Ddeprecated=false -Dexamples=false -Ddocs=false
- path: [subpackages, name=libvips-doc]
  delete: true
- path: [test, pipeline, name=Encode and decode HEIC and AVIF images]
  delete: true
- path: [test, pipeline, name=Check that HEIF support is built in]
  delete: true
- path: [test, pipeline]
  append:
  - name: Retained formats work and unused loaders are absent
    runs: ${file:tests/probe.sh}
