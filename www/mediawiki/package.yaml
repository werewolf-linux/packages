# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  github:
    identifier: wikimedia/mediawiki
    use-tag: true
melange:
  # MediaWiki for werewolf's mediawiki form, as Wolfi would package it: the
  # release tarball, checked by sha256, laid in /usr/share/mediawiki. It is
  # PHP, so nothing is compiled; the form names the PHP it runs on. 1.43 is
  # the long-term release, supported into December 2027: an update's schema
  # changes are one way, and a slot rolled back must still read /data. The
  # test suite and the web installer are left out: the form installs from
  # the machine's config before the wiki serves. Offered to wolfi-dev/os as
  # it is; when Wolfi ships it, the form names the package and this file
  # goes.
  package:
    name: mediawiki
    version: 1.46.2
    epoch: 7
    description: The wiki engine of Wikipedia, long-term release
    copyright:
      - license: GPL-2.0-or-later
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
  pipeline:
    - runs: mkdir -p mediawiki
    - uses: fetch
      with:
        uri: https://releases.wikimedia.org/mediawiki/1.46/mediawiki-${{package.version}}.tar.gz
        expected-sha256: 8f7f937f8bbc1acd4cef1c5362a95f248dcd242020f2588798eb2f73ac2e69ba
        directory: mediawiki
    # Left out besides: the bundled extensions that run a program (Scribunto
    # carries Lua binaries for x86, SyntaxHighlight pygmentize, Math and
    # PdfHandler their renderers), and every file's execute bit, as nothing
    # here is run but by PHP.
    - runs: |
        cd mediawiki
        rm -rf tests mw-config extensions/Scribunto extensions/SyntaxHighlight_GeSHi \
          extensions/Math extensions/PdfHandler
        find . -type f -exec chmod a-x {} +
        cd ..
        mkdir -p ${{targets.destdir}}/usr/share
        mv mediawiki ${{targets.destdir}}/usr/share/mediawiki
  test:
    environment:
      contents:
        packages:
          - php-8.4
    pipeline:
      - name: Installed PHP entrypoint and release
        runs: |
          php -l /usr/share/mediawiki/index.php
          grep -F '${{package.version}}' /usr/share/mediawiki/includes/Defines.php
          test ! -d /usr/share/mediawiki/mw-config
          test ! -d /usr/share/mediawiki/extensions/Scribunto
changes:
  - what: 'MediaWiki for werewolf''s mediawiki form, as Wolfi would package it: the release tarball, checked by sha256, laid in /usr/share/mediawiki. It is PHP, so nothing is compiled; the form names the PHP it runs on. 1.43 is the long-term release, supported into December 2027: an update''s schema changes are one way, and a slot rolled back must still read /data. The test suite and the web installer are left out: the form installs from the machine''s config before the wiki serves. Offered to wolfi-dev/os as it is; when Wolfi ships it, the form names the package and this file goes.'
    why: Provide an independently maintained application context with immutable sources and separately updatable Wolfi dependencies.
    evidence:
      - package.yaml
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
