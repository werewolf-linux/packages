# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  source: pypi
  project: langflow
  lock: langflow
test:
  confined: true
  allow:
    - python:native
melange:
  package:
    name: langflow
    version: "1.13.1"
    epoch: 0
    description: Langflow editor, API and local CPU inference on hardened Python
    copyright:
      - license: MIT
    dependencies:
      runtime:
        - python-3.15>=3.15.0_git20261010-r2000
        # Minimum compatible build; newer ONNX releases can publish independently.
        - py3.15-onnxruntime>=1.31.0-r1
        - libstdc++
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
        - build-base
        - clang-23
        - cmake
        - ninja-build
        - rust-1.98
        - ca-certificates-bundle
        - python-3.15
        - python-3.15-dev
        - uv
        - patch
    environment:
      CC: clang
      CXX: clang++
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      PATH: /usr/lib/ninja-build/bin:/usr/local/bin:/usr/bin:/bin
      UV_PYTHON_DOWNLOADS: never
      UV_LINK_MODE: copy
      # Pip's guest-local wheel cache would duplicate the installed environment.
      PIP_NO_CACHE_DIR: "1"
  pipeline:
    - uses: fetch
      with:
        uri: "https://files.pythonhosted.org/packages/7b/75/9411b4fa0dc7b6182309ae9325a37628a232b61440144a87a2feea30c58b/langflow-1.13.1-py3-none-any.whl"
        expected-sha256: "e07ab6510642563eb0e7ef48ffee5f262ffc1ab7ef4bf8c5cee43562fc1e0089"
        extract: false
    - uses: fetch
      with:
        uri: "https://files.pythonhosted.org/packages/66/2b/7d54ba3120dc32388acb6d39cac9cc1eaf74e332d50618082290f310c753/langflow_base-1.13.1-py3-none-any.whl"
        expected-sha256: "c9dd778c1c001c4ae3f9aa4a90d5f3457fd6404362e5ea1c17fefa8b24a4a0e2"
        extract: false
    - uses: fetch
      with:
        uri: "https://files.pythonhosted.org/packages/73/cf/a880e99a957755b5555f40d93ac757d477f9404f6af10bbb331e5b6152a4/lfx-1.13.1-py3-none-any.whl"
        expected-sha256: "f2eefcf2577e0d1561988b87e7495ca9d9aa1cbc8e29b0798129b0cc789fa834"
        extract: false
    - runs: |
        # Use CP315 wheel tags. Only metadata's Python upper bounds are bypassed;
        # no CP314 binary or alternate interpreter is installed.
        werewolf-tools/package-helper --action requirements
        python3.15 -m venv --system-site-packages /usr/lib/langflow
        # FastUUID's PyO3 0.26 supports Python through 3.14. Its documented
        # stable ABI mode is forward compatible; scope this to that build alone.
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 /usr/lib/langflow/bin/python -m pip install \
          --no-deps --require-hashes --no-binary=fastuuid -r fastuuid-requirements.txt
        /usr/lib/langflow/bin/python -m pip install --no-deps --ignore-requires-python \
          --require-hashes --prefer-binary --only-binary=apsw,chromadb -r minimal-requirements.txt
        /usr/lib/langflow/bin/python -m pip install --no-deps --ignore-requires-python \
          langflow-1.13.1-py3-none-any.whl langflow_base-1.13.1-py3-none-any.whl lfx-1.13.1-py3-none-any.whl
        # APSW's wheel bundles non-PIE SQLite diagnostic executables. Langflow
        # uses the binding, not those command-line tools.
        rm -rf /usr/lib/langflow/lib/python3.15/site-packages/apsw/sqlite_extra_binaries
        /usr/lib/langflow/bin/python -P -c 'import fastuuid; value=fastuuid.uuid4(); assert fastuuid.UUID(str(value)) == value'
        werewolf-tools/package-helper --action python-port --root /usr/lib/langflow/lib/python3.15/site-packages
        patch --batch --fuzz=0 -p1 -d /usr/lib/langflow/lib/python3.15/site-packages < native-tracing.patch
        /usr/lib/langflow/bin/python consumers.py
        # Import the complete API during packaging, so missing runtime providers
        # and interpreter compatibility errors fail before an image is shipped.
        cp check-import.py /usr/lib/langflow/check-import.py
        /usr/lib/langflow/bin/python -P /usr/lib/langflow/check-import.py
        cp server.py /usr/lib/langflow/server.py
        cp check-embedding.py /usr/lib/langflow/check-embedding.py
        PYTHONHASHSEED=0 /usr/lib/langflow/bin/python -m compileall \
          -q -f -j 1 --invalidation-mode checked-hash /usr/lib/langflow
        # Remove installer entrypoints and their implementations from the runtime.
        rm -rf /usr/lib/langflow/lib/python3.15/site-packages/pip \
          /usr/lib/langflow/lib/python3.15/site-packages/pip-*.dist-info
        rm -f /usr/lib/langflow/bin/activate* /usr/lib/langflow/bin/pip*
        mkdir -p ${{targets.destdir}}/usr/lib
        cp -a /usr/lib/langflow ${{targets.destdir}}/usr/lib/langflow
  test:
    environment:
      contents:
        packages:
          - onnx-minilm-l6-v2
    pipeline:
      - name: Installed package consumers
        runs: |-
          /usr/lib/langflow/bin/python -P /usr/lib/langflow/check-import.py
          /usr/lib/langflow/bin/python -P /usr/lib/langflow/check-embedding.py
changes:
  - what: Package the editor and API with coordinated wheel pins, Python 3.15 dependency overrides and a separately compiled fastuuid dependency.
    why: Provide an independently maintained application context with immutable sources and separately updatable Wolfi dependencies.
    evidence:
      - package.yaml
  - evidence:
      - package.yaml
      - native-tracing.patch
      - consumers.py
    what: Omit external tracing integrations and instrumentation, uvloop, runtime developer/test tools, and optional IBM Db2, Oracle, Cassandra and DuckDB drivers; retain native graph traces, SQLite, Chroma and common model clients.
    why: Establish the package's minimized policy.
    claims:
      - minimized
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
actions:
  python-port:
    files:
      - path: langchain/chains/base.py
        optional: true
        when-contains: '    def dict('
        require-contains: import builtins
        qualify:
          dict: builtins.dict
      - path: langchain_classic/chains/base.py
        optional: true
        when-contains: '    def dict('
        require-contains: import builtins
        qualify:
          dict: builtins.dict
      - path: litellm/router_strategy/complexity_router/config.py
        replace:
          - old: import sre_constants
            new: from re import _constants as sre_constants
          - old: import sre_parse
            new: from re import _parser as sre_parse
  requirements:
    requirements:
      input: requirements.txt
      output: minimal-requirements.txt
      omit:
        - cassandra-driver
        - duckdb
        - ibm-db
        - oracledb
        - arize-phoenix-otel
        - langfuse
        - openlayer
        - opik
        - traceloop-sdk
        - uvloop
        - pyright
        - nodeenv
        - pytest
        - pytest-asyncio
        - pytest-json-report
        - pytest-metadata
      omit-prefixes:
        - opentelemetry-instrumentation
