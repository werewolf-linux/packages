# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  source: npm
  project: n8n
  lock: npm
  components:
    launcher-version:
      commit-var: launcher-commit
      repo: n8n-io/task-runner-launcher
      source: github
test:
  confined: true
  allow:
    - node:native
    - node:writable-source
melange:
  package:
    name: n8n
    version: "2.45.5"
    epoch: 0
    description: n8n workflow automation on hardened Node.js
    copyright:
      - license: LicenseRef-Sustainable-Use
    dependencies:
      runtime:
        - nodejs-hardened
        - nodejs-26>=26.12.0-r2000
        - libstdc++
  vars:
    launcher-version: 1.5.1
    launcher-commit: 871cb76bc35c990f368eaa788f0b4ce7b145e143
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
        - ca-certificates-bundle
        - build-base
        - ccache
        # isolated-vm links the shared libraries in Node's build configuration.
        - brotli-dev
        - c-ares-dev
        - icu-dev
        - libuv-dev
        - nghttp2-dev
        - openssl-4.0-dev
        - zlib-dev
        - nodejs-26
        - npm
        - node-gyp
        - python-3.15
        - go-1.27
  pipeline:
    - uses: fetch
      with:
        uri: https://codeload.github.com/n8n-io/task-runner-launcher/tar.gz/${{vars.launcher-commit}}
        expected-sha256: f858cda1a8b30ffb91d2ed7b7c89ac2e1ac063319872e907085b976192301e05
        extract: false
    - runs: |
        # Build native addons for the same Node major as the hardened runtime.
        npm ci --omit=dev --ignore-scripts --prefer-offline --no-audit --no-fund
        node prune-optional.cjs
        node port-node.cjs
        # Bound parallel C++ compilation to fit the standard 8 GiB builder.
        # Melange persists /var/cache/melange between bubblewrap builds.
        export CC="ccache gcc" CXX="ccache g++"
        export CCACHE_DIR=/var/cache/melange/ccache/n8n CCACHE_MAXSIZE=256M
        # Fresh guests change compiler mtimes; identify compilers by content.
        export CCACHE_COMPILERCHECK=content
        jobs=$(nproc)
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        (cd node_modules/sqlite3 && node-gyp rebuild --nodedir=/usr --jobs="$jobs")
        (cd node_modules/isolated-vm && node-gyp rebuild --nodedir=/usr --jobs="$jobs")
        ccache --show-stats
        test -s node_modules/sqlite3/build/Release/node_sqlite3.node
        test -s node_modules/isolated-vm/build/Release/isolated_vm.node
        node --no-node-snapshot -e 'const ivm = require("isolated-vm"); const isolate = new ivm.Isolate({memoryLimit: 16}); isolate.dispose();'
        # Keep the runtime bindings, not object files, generated SQLite source,
        # static archives or node-gyp metadata. Retain each binding's load path.
        for addon in sqlite3 isolated-vm; do
          binding=node_modules/$addon/build/Release
          find "$binding" -maxdepth 1 -name '*.node' -exec strip --strip-unneeded {} +
          find node_modules/$addon/build -mindepth 1 -maxdepth 1 ! -name Release -exec rm -rf {} +
          find "$binding" -mindepth 1 -maxdepth 1 ! -name '*.node' -exec rm -rf {} +
        done
        dest=${{targets.destdir}}/usr/lib/n8n
        mkdir -p "$dest"
        # Move the installed tree: exporting a second source copy doubles
        # builder I/O without changing the runtime package.
        mv node_modules "$dest/"
        cp package.json package-lock.json "$dest/"
        mkdir launcher
        tar -xzf ${{vars.launcher-commit}} -C launcher --strip-components=1
        # The launcher otherwise binds its private health endpoint on all interfaces.
        sed -i 's/fmt.Sprintf(":%s", port)/fmt.Sprintf("127.0.0.1:%s", port)/' launcher/internal/http/healthcheck_server.go
        (cd launcher && CGO_ENABLED=0 GOCACHE=/var/cache/melange/go-build go build -buildmode=pie -mod=readonly -trimpath -ldflags='-s -w' -o "$dest/task-runner-launcher" ./cmd/launcher)
        cp task-runners.json "$dest/"
        install -Dm644 launcher/LICENSE.md "$dest/licenses/task-runner-launcher.LICENSE.md"
        install -Dm644 launcher/LICENSE_EE.md "$dest/licenses/task-runner-launcher.LICENSE_EE.md"
  test:
    pipeline:
      - name: Installed package consumers
        runs: |-
          node /usr/lib/n8n/node_modules/n8n/bin/n8n --version | grep -F '${{package.version}}'
          node --no-node-snapshot n8n-check.cjs
checks:
  - name: Production dependency pruning
    working-directory: tests
    runs: go test prune_test.go
changes:
  - what: Package the locked npm release; remove optional profilers, watchers, third-party source maps, TypeScript declarations, unused platform binaries and native compiler outputs.
    why: Reduce package size and build I/O while retaining workflow backends, editor assets and first-party diagnostics. Compile native addons with bounded parallelism and a 256 MB compiler cache.
    evidence:
      - package.yaml
      - port-node.cjs
      - prune-optional.cjs
    claims:
      - minimized
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
