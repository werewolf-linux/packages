# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  github:
    identifier: nextcloud/server
    strip-prefix: v
    use-tag: true
melange:
  # Nextcloud for werewolf's nextcloud form, as Wolfi would package it: the
  # release tarball, checked by sha256, laid in /usr/share/nextcloud. It is
  # PHP, so nothing is compiled; the form names the PHP it runs on. Wolfi's
  # own nextcloud-server-33 is a container's: Apache, bash and PHP 8.3, a
  # major release behind. Offered to wolfi-dev/os as it is; when Wolfi
  # ships it, the form names the package and this file goes.
  package:
    name: nextcloud
    version: 35.0.2
    epoch: 7
    description: Nextcloud server, a safe home for all your data
    copyright:
      - license: AGPL-3.0-or-later
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
        - bzip2
  pipeline:
    - runs: mkdir -p nextcloud
    - uses: fetch
      with:
        uri: https://download.nextcloud.com/server/releases/nextcloud-${{package.version}}.tar.bz2
        expected-sha256: dfc7955eaec5621de90e031d10f76006173b3f3e31d5d6e174821d1da14f162d
        directory: nextcloud
    # The installer's flag for a web install: this form installs from the
    # machine's config before the site serves, and keeps its config on /data.
    - runs: |
        rm -f nextcloud/config/CAN_INSTALL
        mkdir -p ${{targets.destdir}}/usr/share
        mv nextcloud ${{targets.destdir}}/usr/share/nextcloud
  test:
    environment:
      contents:
        packages:
          - php-8.4
    pipeline:
      - name: Installed PHP entrypoint and release
        runs: |
          php -l /usr/share/nextcloud/index.php
          php -l /usr/share/nextcloud/version.php
          grep -F '${{package.version}}' /usr/share/nextcloud/version.php
          test ! -e /usr/share/nextcloud/config/CAN_INSTALL
changes:
  - what: 'Nextcloud for werewolf''s nextcloud form, as Wolfi would package it: the release tarball, checked by sha256, laid in /usr/share/nextcloud. It is PHP, so nothing is compiled; the form names the PHP it runs on. Wolfi''s own nextcloud-server-33 is a container''s: Apache, bash and PHP 8.3, a major release behind. Offered to wolfi-dev/os as it is; when Wolfi ships it, the form names the package and this file goes.'
    why: Provide an independently maintained application context with immutable sources and separately updatable Wolfi dependencies.
    evidence:
      - package.yaml
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
