name: Set up the package builder
description: Install pinned tools and check the native build sandbox
runs:
  using: composite
  steps:
    - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
      with:
        go-version: '1.27.x'
        cache-dependency-path: Werewolf/go.sum
    - shell: bash
      run: make tools
    - shell: bash
      run: |
        if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
          sudo -n apt-get -o Acquire::Retries=3 update
          sudo -n apt-get -o Acquire::Retries=3 install -y bubblewrap git make patch
        else
          for tool in bwrap git make patch unshare newuidmap newgidmap; do
            command -v "$tool" >/dev/null || { echo "Missing native builder: $tool" >&2; exit 1; }
          done
        fi
        Werewolf/.work/tools/package install-melange --dest Werewolf/.work/tools/melange
        Werewolf/runner/ci-root "$PWD/Werewolf/.work/tools/package" setup-runner
        Werewolf/runner/ci-root "$PWD/Werewolf/.work/tools/bwrap" --ro-bind / / --dev /dev --proc /proc --unshare-pid \
          --cap-add CAP_SYS_CHROOT -- "$PWD/Werewolf/.work/tools/package" chroot-probe
        if [ -f Werewolf/.work/tools/bwrap.apparmor ]; then
          Werewolf/runner/ci-root /usr/bin/bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid \
            --cap-add CAP_SYS_CHROOT -- "$PWD/Werewolf/.work/tools/package" chroot-probe --expect-denied
        fi
