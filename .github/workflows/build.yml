name: native package build
on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      arch:
        type: string
        required: true
      engine:
        type: string
        default: upstream
      inputs_artifact:
        type: string
        default: ''
      trusted:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: >-
      ${{ fromJSON(inputs.trusted &&
          (inputs.arch == 'aarch64' && vars.WEREWOLF_ARM64_BUILD_RUNNER ||
           inputs.arch == 'x86_64' && vars.WEREWOLF_X86_64_BUILD_RUNNER) ||
          (inputs.arch == 'aarch64' && '["ubuntu-26.04-arm"]' || '["ubuntu-26.04"]')) }}
    timeout-minutes: 360
    env:
      PACKAGE: ${{ inputs.package }}
      ARCH: ${{ inputs.arch }}
    steps:
      - name: Remove what an interrupted build left
        if: runner.environment == 'self-hosted'
        run: |
          for directory in Werewolf/.work build; do
            if [ -d "$directory" ]; then
              unshare --user --map-auto --map-root-user rm -rf -- "$directory"
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-builder
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.engine == 'wolfi'
        with:
          name: ${{ inputs.inputs_artifact }}
          path: Werewolf/.work/input-bundle
      - name: Restore the source snapshot selected before native validation
        if: inputs.engine == 'wolfi'
        run: Werewolf/.work/tools/package restore-inputs --package "$PACKAGE" --archive "Werewolf/.work/input-bundle/$PACKAGE.tar.gz"
      - name: Locate generated work and artifacts
        id: paths
        run: Werewolf/.work/tools/package paths --package "$PACKAGE" --arch "$ARCH" --github
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: Werewolf/.work/cache
          key: source-${{ inputs.arch }}-${{ inputs.package }}-${{ hashFiles(format('{0}/**', steps.paths.outputs.context), 'Werewolf/tools.lock.json') }}
          restore-keys: source-${{ inputs.arch }}-${{ inputs.package }}-
      - name: Build and validate the selected package
        run: |
          set -o pipefail
          mkdir -p '${{ steps.paths.outputs.logs }}'
          Werewolf/runner/ci-root mkdir -p Werewolf/.work/cache/melange
          Werewolf/runner/ci-root env PATH="$PWD/Werewolf/.work/tools:$PATH" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            Werewolf/.work/tools/package build --package "$PACKAGE" --arch "$ARCH" \
            2>&1 | tee '${{ steps.paths.outputs.logs }}/build.log'
      - name: Exercise installed application packages
        if: inputs.engine == 'upstream'
        run: |
          set -o pipefail
          Werewolf/runner/ci-root env PATH="$PWD/Werewolf/.work/tools:$PATH" \
            Werewolf/.work/tools/package test --package "$PACKAGE" --arch "$ARCH" \
            2>&1 | tee -a '${{ steps.paths.outputs.logs }}/build.log'
      - name: Restore artifact ownership
        if: always()
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ] && [ -d Werewolf/.work ]; then
            Werewolf/runner/ci-root chown -R "$(id -u):$(id -g)" Werewolf/.work
          fi
      - name: Verify native application provenance
        if: inputs.engine == 'upstream'
        run: PATH="$PWD/Werewolf/.work/tools:$PATH" Werewolf/.work/tools/package artifact-verify --package "$PACKAGE" --arch "$ARCH"
      - name: Record successful Wolfi native validation
        if: inputs.engine == 'wolfi'
        run: Werewolf/.work/tools/package provenance --package "$PACKAGE" --arch "$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.package }}-${{ inputs.arch }}
          path: ${{ steps.paths.outputs.artifacts }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: log-${{ inputs.package }}-${{ inputs.arch }}
          path: ${{ steps.paths.outputs.logs }}
          if-no-files-found: ignore
      - name: Release disposable guest roots after saving diagnostics
        if: always() && steps.paths.outcome == 'success'
        run: Werewolf/runner/ci-root Werewolf/.work/tools/package clean --package "$PACKAGE" --arch "$ARCH" --keep-cache
