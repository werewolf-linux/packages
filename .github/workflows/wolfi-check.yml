name: check Wolfi overlays
# Every pull request: the unit tests, then each package captured from Wolfi's
# newest stable recipe, verified, derived and patched by the common Go command.
# Nothing is built or published, and GitHub is told nothing; build.yml builds
# one package by hand.
on:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: wolfi
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
      - run: make -C .. tools
      - name: Install tools and run the unit tests
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y patch
          make test lint
      - name: Capture, verify, derive and patch every package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ../build/tools/package discover | tee build/discover.log
