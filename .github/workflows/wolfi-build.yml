name: build
# One package on both architectures: Melange builds it in bubblewrap, runs
# Wolfi's package tests and the package's own probe, and records provenance.
# By hand it captures Wolfi's newest recipe and signs with a throwaway key;
# refresh.yml calls it with the inputs discovery captured, signing for release.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Stable package name from the catalog
        type: string
        required: true
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      inputs_artifact:
        type: string
        default: ''
      production:
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: wolfi
jobs:
  build:
    if: >-
      github.repository == 'werewolf-linux/packages' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    concurrency:
      group: native-build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.package }}-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ${{ vars.WEREWOLF_X86_64_BUILD_RUNNER || '["ubuntu-26.04"]' }}
          - arch: aarch64
            runner: ${{ vars.WEREWOLF_ARM64_BUILD_RUNNER || '["ubuntu-26.04-arm"]' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    environment: ${{ inputs.production && 'release' || 'ci' }}
    timeout-minutes: 300
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      # A cancelled or killed build can leave files its user namespace owns,
      # which neither this account nor checkout's clean can remove: remove
      # them as that namespace first, as checkout would. Hosted runners start clean.
      - name: Remove what an interrupted build left
        if: runner.environment == 'self-hosted'
        working-directory: .
        run: |
          for directory in build wolfi/build; do
            if [ -d "$directory" ]; then
              unshare --user --map-auto --map-root-user rm -rf -- "$directory"
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
      - run: make -C .. tools
      - name: Name a package this repository builds
        run: ../build/tools/package catalog --engine wolfi path "$PACKAGE" >/dev/null
      - name: Check native runner architecture and resources
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$EXPECTED_ARCH:$(uname -m)" in
            x86_64:x86_64|aarch64:aarch64) ;;
            *) echo 'Runner architecture does not match the package build'; exit 1 ;;
          esac
          echo "Runner: $RUNNER_NAME"
          echo "Available CPUs: $(nproc)"
          free -h
      - name: Install build tools
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo -n apt-get -o Acquire::Retries=3 update
            sudo -n apt-get -o Acquire::Retries=3 install -y bubblewrap git make patch
          else
            for tool in bwrap git make patch unshare newuidmap newgidmap; do
              command -v "$tool" >/dev/null || {
                echo "Install $tool on the self-hosted runner before building" >&2
                exit 1
              }
            done
          fi
          ../build/tools/package install-melange --dest ../build/tools/melange
          scripts/ci-root "$PWD/../build/tools/package" setup-runner
      - name: Check sandbox chroot before building
        run: |
          scripts/ci-root "$PWD/../build/tools/bwrap" --ro-bind / / --dev /dev --proc /proc --unshare-pid \
            --cap-add CAP_SYS_CHROOT -- "$PWD/../build/tools/package" chroot-probe
          if [ -f "$PWD/../build/tools/bwrap.apparmor" ]; then
            scripts/ci-root /usr/bin/bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid \
              --cap-add CAP_SYS_CHROOT -- "$PWD/../build/tools/package" chroot-probe --expect-denied
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.inputs_artifact != ''
        with:
          name: ${{ inputs.inputs_artifact }}
          path: wolfi/build/input-bundle
      - name: Restore captured inputs with their file modes
        if: inputs.inputs_artifact != ''
        run: |
          ../build/tools/package restore-inputs --package "$PACKAGE" --archive "build/input-bundle/$PACKAGE.tar.gz"
      - name: Capture the latest stable source and Wolfi recipe for a build by hand
        if: inputs.inputs_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../build/tools/package refresh --package "$PACKAGE"
      - name: Verify provenance and derivation
        run: make PACKAGE="$PACKAGE" check derive
      - name: Apply every patch at the locked source
        run: make PACKAGE="$PACKAGE" prepare
      - name: Write production signing key
        if: inputs.production
        env:
          PACKAGES_APK_SIGNING_KEY: ${{ secrets.WEREWOLF_PACKAGES_KEY }}
        run: |
          test -n "$PACKAGES_APK_SIGNING_KEY"
          ../build/tools/package signing-key --engine wolfi --production
      - name: Build and test signed packages
        run: |
          set -o pipefail
          scripts/ci-root env PATH="$PWD/../build/tools:$PATH" make PACKAGE="$PACKAGE" \
            ARCH=${{ matrix.arch }} build 2>&1 | tee build/build.log
      - name: Record successful native validation
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            scripts/ci-root chown -R "$(id -u):$(id -g)" "build/$PACKAGE/packages"
          fi
          ../build/tools/package provenance --package "$PACKAGE" --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.package }}-${{ matrix.arch }}
          path: wolfi/build/${{ inputs.package }}/packages/
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-${{ inputs.package }}-${{ matrix.arch }}
          path: |
            wolfi/build/build.log
            wolfi/build/${{ inputs.package }}/inputs/upstream.lock.json
            wolfi/build/${{ inputs.package }}/${{ inputs.package }}.yaml
          if-no-files-found: warn
      - name: Restore build ownership for the next checkout
        if: always()
        run: |
          if [ -d build ]; then
            owner=0:0
            if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
              owner="$(id -u):$(id -g)"
            fi
            scripts/ci-root chown -R "$owner" build
          fi
