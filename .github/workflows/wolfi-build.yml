name: build
# One package on both architectures: Melange builds it in bubblewrap, runs
# Wolfi's package tests and the package's own probe, and records provenance.
# By hand it captures Wolfi's newest recipe and signs with a throwaway key;
# refresh.yml calls it with the inputs discovery captured, signing for release.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Stable package name from the catalog
        type: string
        required: true
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      inputs_artifact:
        type: string
        default: ''
      production:
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: .
jobs:
  build:
    if: >-
      github.repository == 'werewolf-linux/packages' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    concurrency:
      group: native-build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.package }}-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ${{ vars.WEREWOLF_X86_64_BUILD_RUNNER || '["ubuntu-26.04"]' }}
          - arch: aarch64
            runner: ${{ vars.WEREWOLF_ARM64_BUILD_RUNNER || '["ubuntu-26.04-arm"]' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    environment: ${{ inputs.production && 'release' || 'ci' }}
    timeout-minutes: 300
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      # A cancelled or killed build can leave files its user namespace owns,
      # which neither this account nor checkout's clean can remove: remove
      # them as that namespace first, as checkout would. Hosted runners start clean.
      - name: Remove what an interrupted build left
        if: runner.environment == 'self-hosted'
        working-directory: .
        run: |
          for directory in Werewolf/.work build; do
            if [ -d "$directory" ]; then
              unshare --user --map-auto --map-root-user rm -rf -- "$directory"
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-builder
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.inputs_artifact != ''
        with:
          name: ${{ inputs.inputs_artifact }}
          path: Werewolf/.work/input-bundle
      - name: Restore captured inputs with their file modes
        if: inputs.inputs_artifact != ''
        run: |
          Werewolf/.work/tools/package restore-inputs --package "$PACKAGE" --archive "Werewolf/.work/input-bundle/$PACKAGE.tar.gz"
      - name: Capture the latest stable source and Wolfi recipe for a build by hand
        if: inputs.inputs_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: Werewolf/.work/tools/package refresh --package "$PACKAGE"
      - name: Locate the captured work and artifacts
        id: paths
        run: Werewolf/.work/tools/package paths --package "$PACKAGE" --arch '${{ matrix.arch }}' --github
      - name: Verify provenance and derivation
        run: Werewolf/.work/tools/package derive --package "$PACKAGE"
      - name: Write production signing key
        if: inputs.production
        env:
          PACKAGES_APK_SIGNING_KEY: ${{ secrets.WEREWOLF_PACKAGES_KEY }}
        run: |
          test -n "$PACKAGES_APK_SIGNING_KEY"
          Werewolf/.work/tools/package signing-key --engine wolfi --production
      - name: Build and test signed packages
        run: |
          set -o pipefail
          mkdir -p '${{ steps.paths.outputs.logs }}'
          Werewolf/runner/ci-root env PATH="$PWD/Werewolf/.work/tools:$PATH" make PACKAGE="$PACKAGE" \
            ARCH=${{ matrix.arch }} build 2>&1 | tee '${{ steps.paths.outputs.logs }}/build.log'
      - name: Record successful native validation
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            Werewolf/runner/ci-root chown -R "$(id -u):$(id -g)" '${{ steps.paths.outputs.artifacts }}'
          fi
          Werewolf/.work/tools/package provenance --package "$PACKAGE" --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.package }}-${{ matrix.arch }}
          path: ${{ steps.paths.outputs.artifacts }}
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-${{ inputs.package }}-${{ matrix.arch }}
          path: |
            ${{ steps.paths.outputs.logs }}
            ${{ steps.paths.outputs.inputs }}
            ${{ steps.paths.outputs.build }}/*.yaml
          if-no-files-found: warn
      - name: Release disposable guest roots after saving diagnostics
        if: always() && steps.paths.outcome == 'success'
        run: Werewolf/runner/ci-root Werewolf/.work/tools/package clean --package "$PACKAGE" --arch '${{ matrix.arch }}' --keep-cache
      - name: Restore build ownership for the next checkout
        if: always()
        run: |
          if [ -d Werewolf/.work ]; then
            owner=0:0
            if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
              owner="$(id -u):$(id -g)"
            fi
            Werewolf/runner/ci-root chown -R "$owner" Werewolf/.work
          fi
