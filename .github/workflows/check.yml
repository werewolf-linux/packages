name: check
on:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Context to build and smoke-test on both native architectures
        type: string
        default: onnx-minilm
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: >-
      ${{ fromJSON(github.repository == 'werewolf-linux/packages' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.pull_request.head.repo.full_name == github.repository) &&
          vars.WEREWOLF_X86_64_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    timeout-minutes: 20
    steps:
      # A cancelled build can leave files its user namespace owns, which
      # neither this account nor checkout's clean can remove: remove them as
      # that namespace first, as checkout would. Hosted runners start clean.
      - name: Remove what a cancelled build left
        if: runner.environment == 'self-hosted'
        run: |
          for directory in build wolfi/build; do
            if [ -d "$directory" ]; then
              unshare --user --map-auto --map-root-user rm -rf -- "$directory"
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
      - run: python3 scripts/install-melange.py --dest build/tools/melange
      - name: Install package test dependencies
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install -r wolfi/requirements.txt
      - run: PATH="$PWD/build/tools:$PATH" make PYTHON=build/venv/bin/python test check
      - name: Validate every context and its APK names
        run: PATH="$PWD/build/tools:$PATH" python3 scripts/plan.py --offline
  native-smoke:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/build.yml
    with:
      package: ${{ inputs.package || 'onnx-minilm' }}
      arch: ${{ matrix.arch }}
      trusted: ${{ github.repository == 'werewolf-linux/packages' &&
        (github.event_name == 'workflow_dispatch' ||
         github.event.pull_request.head.repo.full_name == github.repository) }}

  wordpress-smoke:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/build.yml
    with:
      package: wordpress-sqlite
      arch: ${{ matrix.arch }}
      trusted: ${{ github.repository == 'werewolf-linux/packages' &&
        (github.event_name == 'workflow_dispatch' ||
         github.event.pull_request.head.repo.full_name == github.repository) }}
