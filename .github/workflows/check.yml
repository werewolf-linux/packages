name: check
on:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Context to build and smoke-test on both native architectures
        type: string
        default: onnx-minilm
      use_hosted:
        description: Use native GitHub-hosted runners for this validation run
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: >-
      ${{ fromJSON(github.repository == 'werewolf-linux/packages' &&
          !inputs.use_hosted &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.pull_request.head.repo.full_name == github.repository) &&
          vars.WEREWOLF_X86_64_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      wolfi: ${{ steps.plan.outputs.wolfi }}
      has_build: ${{ steps.plan.outputs.has_build }}
    timeout-minutes: 20
    steps:
      # A cancelled build can leave files its user namespace owns, which
      # neither this account nor checkout's clean can remove: remove them as
      # that namespace first, as checkout would. Hosted runners start clean.
      - name: Remove what a cancelled build left
        if: runner.environment == 'self-hosted'
        run: |
          for directory in Werewolf/.work build; do
            if [ -d "$directory" ]; then
              unshare --user --map-auto --map-root-user rm -rf -- "$directory"
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
          cache-dependency-path: Werewolf/go.sum
      - run: make tools
      - run: Werewolf/.work/tools/package install-melange --dest Werewolf/.work/tools/melange
      - run: PATH="$PWD/Werewolf/.work/tools:$PATH" make test lint check
      - name: Plan changed package validation
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          PACKAGE: ${{ inputs.package }}
        run: |
          args=(plan --json --github)
          if [ -n "$BASE" ]; then args+=(--base "$BASE" --head "$HEAD"); fi
          if [ -n "$PACKAGE" ]; then args+=(--package "$PACKAGE"); fi
          Werewolf/.work/tools/package "${args[@]}"
  runner-profile:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
          cache-dependency-path: Werewolf/go.sum
      - run: make tools
      - name: Install and exercise the confined build runner
        run: |
          sudo -n apt-get -o Acquire::Retries=3 update
          sudo -n apt-get -o Acquire::Retries=3 install -y bubblewrap
          sudo -n "$PWD/Werewolf/.work/tools/package" setup-runner
  capture:
    needs: check
    if: needs.check.outputs.wolfi != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check.outputs.wolfi) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
          cache-dependency-path: Werewolf/go.sum
      - run: make tools
      - name: Select one immutable snapshot before either architecture builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: Werewolf/.work/tools/package discover --package "$PACKAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: inputs-${{ matrix.package }}
          path: Werewolf/.work/bundles/${{ matrix.package }}.tar.gz
          if-no-files-found: error
  native:
    name: ${{ matrix.package }} (${{ matrix.arch }})
    needs: [check, capture]
    if: always() && !cancelled() && needs.check.result == 'success' && needs.check.outputs.has_build == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      package: ${{ matrix.package }}
      arch: ${{ matrix.arch }}
      engine: ${{ matrix.engine }}
      inputs_artifact: inputs-${{ matrix.package }}
      trusted: ${{ github.repository == 'werewolf-linux/packages' &&
        !inputs.use_hosted &&
        (github.event_name == 'workflow_dispatch' ||
         github.event.pull_request.head.repo.full_name == github.repository) }}
