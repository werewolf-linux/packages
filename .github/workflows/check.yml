name: check
on:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Context to build and smoke-test on both native architectures
        type: string
        default: onnx-minilm
      use_hosted:
        description: Use native GitHub-hosted runners for this validation run
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: >-
      ${{ fromJSON(github.repository == 'werewolf-linux/packages' &&
          !inputs.use_hosted &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.pull_request.head.repo.full_name == github.repository) &&
          vars.WEREWOLF_X86_64_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    timeout-minutes: 20
    steps:
      # A cancelled build can leave files its user namespace owns, which
      # neither this account nor checkout's clean can remove: remove them as
      # that namespace first, as checkout would. Hosted runners start clean.
      - name: Remove what a cancelled build left
        if: runner.environment == 'self-hosted'
        run: |
          for directory in build wolfi/build; do
            if [ -d "$directory" ]; then
              unshare --user --map-auto --map-root-user rm -rf -- "$directory"
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
      - run: make tools
      - run: build/tools/package install-melange --dest build/tools/melange
      - run: PATH="$PWD/build/tools:$PATH" make test lint check
      - name: Validate every context and its APK names
        run: PATH="$PWD/build/tools:$PATH" build/tools/package plan --offline
  runner-profile:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
      - run: make tools
      - name: Install and exercise the confined build runner
        run: |
          sudo -n apt-get -o Acquire::Retries=3 update
          sudo -n apt-get -o Acquire::Retries=3 install -y bubblewrap
          sudo -n "$PWD/build/tools/package" setup-runner
  native-smoke:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/build.yml
    with:
      package: ${{ inputs.package || 'onnx-minilm' }}
      arch: ${{ matrix.arch }}
      trusted: ${{ github.repository == 'werewolf-linux/packages' &&
        !inputs.use_hosted &&
        (github.event_name == 'workflow_dispatch' ||
         github.event.pull_request.head.repo.full_name == github.repository) }}

  wordpress-smoke:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/build.yml
    with:
      package: wordpress-sqlite
      arch: ${{ matrix.arch }}
      trusted: ${{ github.repository == 'werewolf-linux/packages' &&
        !inputs.use_hosted &&
        (github.event_name == 'workflow_dispatch' ||
         github.event.pull_request.head.repo.full_name == github.repository) }}
