name: publish packages
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      package:
        description: Context directory; empty builds all unpublished contexts
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: publish-packages
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'werewolf-linux/packages' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.WEREWOLF_X86_64_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      releases: ${{ steps.plan.outputs.releases }}
      failed: ${{ steps.plan.outputs.failed }}
    steps:
      # A cancelled build can leave files its user namespace owns, which
      # neither this account nor checkout's clean can remove: remove them as
      # that namespace first, as checkout would. Hosted runners start clean.
      - name: Remove what a cancelled build left
        if: runner.environment == 'self-hosted'
        run: |
          for directory in Werewolf/.work build; do
            if [ -d "$directory" ]; then
              unshare --user --map-auto --map-root-user rm -rf -- "$directory"
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
          cache: false
      - run: make tools
      - run: Werewolf/.work/tools/package install-melange --dest Werewolf/.work/tools/melange
      - name: Test the publisher before selecting builds
        run: PATH="$PWD/Werewolf/.work/tools:$PATH" make test lint check
      - name: Select unpublished packages and staged retries
        id: plan
        env:
          PACKAGE: ${{ inputs.package }}
        run: PATH="$PWD/Werewolf/.work/tools:$PATH" Werewolf/.work/tools/package release-plan --package "$PACKAGE"
  release:
    needs: plan
    if: needs.plan.outputs.publish != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.releases) }}
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      package: ${{ matrix.package }}
      build: ${{ matrix.build }}
  result:
    needs: [plan, release]
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(vars.WEREWOLF_X86_64_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    steps:
      - name: Report failures without preventing other packages from publishing
        env:
          PLAN: ${{ needs.plan.result }}
          RELEASE: ${{ needs.release.result }}
          FAILED: ${{ needs.plan.outputs.failed }}
        run: |
          test "$PLAN" = success
          test "$RELEASE" = success || test "$RELEASE" = skipped
          test "$FAILED" = '[]'
