name: publish latest Wolfi packages
# Every ten minutes, from one Wolfi snapshot, every package: capture its newest
# stable recipe, verify, derive and patch it (the common Go command), filing what
# stops it as an issue; then build and publish each one whose release is
# missing or staged. One package's failure holds back no other; it turns this
# run red at the end.
on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:
    inputs:
      package:
        description: One package to refresh or recover; empty refreshes all
        type: string
        default: ''
      recover_run:
        description: Resume validated artifacts from a prior runtime release run (no rebuild)
        type: string
        default: ''
  push:
    branches: [main]
permissions:
  contents: read
# One run at a time. A run that would start behind a long build waits, and a
# newer one replaces it; either way it discovers after the running one has
# published, so nothing builds twice. Recovery runs keep their own group.
concurrency:
  group: wolfi-refresh-${{ github.ref }}-${{ inputs.recover_run }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: .
jobs:
  discover:
    if: github.repository == 'werewolf-linux/packages' && github.ref == 'refs/heads/main' && inputs.recover_run == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      # GitHub requires push access to discover recoverable draft releases.
      contents: write
      issues: write
    outputs:
      build: ${{ steps.discover.outputs.build }}
      publish: ${{ steps.discover.outputs.publish }}
      failed: ${{ steps.discover.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
          cache-dependency-path: Werewolf/go.sum
      - run: make tools
      - name: Install tools and run the unit tests
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y patch
          make test lint
      - name: Check every package against Wolfi's newest recipes
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
        run: Werewolf/.work/tools/package discover --github --package "$PACKAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.discover.outputs.publish != '[]'
        with:
          name: wolfi-inputs
          path: Werewolf/.work/bundles/
          if-no-files-found: error
  build:
    needs: discover
    if: needs.discover.outputs.build != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.build) }}
    uses: ./.github/workflows/wolfi-build.yml
    with:
      package: ${{ matrix.package }}
      inputs_artifact: wolfi-inputs
      production: true
    secrets: inherit
  feed:
    # Backfill existing releases even when discovery needs no builds. New
    # publications also merge their package before completing its release.
    # R2 conditional index writes handle races with this job and other runs.
    needs: discover
    if: always() && !cancelled() && needs.discover.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
          cache-dependency-path: Werewolf/go.sum
      - run: make tools
      - name: Write production signing key
        env:
          PACKAGES_APK_SIGNING_KEY: ${{ secrets.WEREWOLF_PACKAGES_KEY }}
        run: |
          test -n "$PACKAGES_APK_SIGNING_KEY"
          Werewolf/.work/tools/package signing-key --engine wolfi --production
      - name: Merge existing signed packages into the hardened feed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          Werewolf/.work/tools/package feed
  publish:
    needs: [discover, build]
    if: >-
      always() && !cancelled() && needs.discover.result == 'success' &&
      needs.discover.outputs.publish != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.publish) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
          cache-dependency-path: Werewolf/go.sum
      - run: make tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wolfi-inputs
          path: Werewolf/.work/input-bundle
      - name: Restore captured inputs with their file modes
        run: |
          Werewolf/.work/tools/package restore-inputs --package "$PACKAGE" --archive "Werewolf/.work/input-bundle/$PACKAGE.tar.gz"
      # A package that did not build this run has no artifacts; that is checked below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ matrix.package }}-x86_64
          path: Werewolf/.work/artifacts/${{ matrix.package }}-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ matrix.package }}-aarch64
          path: Werewolf/.work/artifacts/${{ matrix.package }}-aarch64
      - name: Stage a recoverable draft from both architectures' builds
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(Werewolf/.work/tools/package status --package "$PACKAGE" --artifacts Werewolf/.work/artifacts | tail -1)
          if [ "$state" = build ]; then
            if [ -f "Werewolf/.work/artifacts/$PACKAGE-x86_64/build.json" ] && [ -f "Werewolf/.work/artifacts/$PACKAGE-aarch64/build.json" ]; then
              Werewolf/.work/tools/package stage --package "$PACKAGE" --artifacts Werewolf/.work/artifacts
            else
              echo "$PACKAGE: not built on both architectures in this run; nothing to publish"
              echo skip=true >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Write production signing key for the stable index
        if: steps.stage.outputs.skip != 'true'
        env:
          PACKAGES_APK_SIGNING_KEY: ${{ secrets.WEREWOLF_PACKAGES_KEY }}
        run: |
          test -n "$PACKAGES_APK_SIGNING_KEY"
          Werewolf/.work/tools/package signing-key --engine wolfi --production
      - name: Publish signed APK repositories and complete the GitHub release
        if: steps.stage.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          Werewolf/.work/tools/package publish --package "$PACKAGE" --artifacts Werewolf/.work/artifacts
  drifted:
    defaults:
      run:
        working-directory: .
    needs: discover
    if: needs.discover.outputs.failed != '[]'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "Stopped this run, each filed as an issue: ${{ needs.discover.outputs.failed }}"
          exit 1

  recover:
    if: github.repository == 'werewolf-linux/packages' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.recover_run != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      PACKAGE: ${{ inputs.package }}
      RECOVER_RUN: ${{ inputs.recover_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: publisher
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
          cache-dependency-path: publisher/Werewolf/go.sum
      - run: make -C publisher tools
        working-directory: .
      - name: Verify the source run passed both native builds
        id: source
        working-directory: .
        run: publisher/Werewolf/.work/tools/package recover --root publisher --run "$RECOVER_RUN" --package "$PACKAGE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.source_sha }}
          path: validated
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wolfi-inputs
          path: validated/Werewolf/.work/input-bundle
          run-id: ${{ inputs.recover_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.package }}-x86_64
          path: validated/Werewolf/.work/artifacts/${{ inputs.package }}-x86_64
          run-id: ${{ inputs.recover_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.package }}-aarch64
          path: validated/Werewolf/.work/artifacts/${{ inputs.package }}-aarch64
          run-id: ${{ inputs.recover_run }}
          github-token: ${{ github.token }}
      - name: Validate and stage the original signed artifacts with the repaired publisher
        working-directory: validated
        env:
          BUILD_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BUILD_SOURCE_RUN_NUMBER: ${{ steps.source.outputs.source_run_number }}
        run: |
          ../publisher/Werewolf/.work/tools/package restore-inputs --root . --package "$PACKAGE" --archive "Werewolf/.work/input-bundle/$PACKAGE.tar.gz"
          ../publisher/Werewolf/.work/tools/package verify-tag --root . --package "$PACKAGE" --source-sha "$BUILD_SOURCE_SHA"
          GITHUB_SHA="$BUILD_SOURCE_SHA" GITHUB_RUN_NUMBER="$BUILD_SOURCE_RUN_NUMBER" GITHUB_RUN_ID="$RECOVER_RUN" \
            ../publisher/Werewolf/.work/tools/package stage --root . --package "$PACKAGE" --artifacts Werewolf/.work/artifacts
      - name: Write the production signing key for the stable index
        working-directory: validated
        env:
          PACKAGES_APK_SIGNING_KEY: ${{ secrets.WEREWOLF_PACKAGES_KEY }}
        run: |
          test -n "$PACKAGES_APK_SIGNING_KEY"
          ../publisher/Werewolf/.work/tools/package signing-key --root . --engine wolfi --production
      - name: Publish both validated architectures and complete the release
        working-directory: validated
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          BUILD_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BUILD_SOURCE_RUN_NUMBER: ${{ steps.source.outputs.source_run_number }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          GITHUB_SHA="$BUILD_SOURCE_SHA" GITHUB_RUN_NUMBER="$BUILD_SOURCE_RUN_NUMBER" GITHUB_RUN_ID="$RECOVER_RUN" \
            ../publisher/Werewolf/.work/tools/package publish --root . --package "$PACKAGE" --artifacts Werewolf/.work/artifacts
