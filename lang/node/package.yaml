# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  github:
    identifier: nodejs/node
    strip-prefix: v
    use-tag: true
wolfi:
  # Checked changes to the captured Wolfi recipe. See docs/overlays.md.
  title: Node.js
  # Keep V8's large compiler processes within the build guest's memory budget.
  resources:
    cpu: "2"
    memory: 16Gi
  sources:
    - https://github.com/nodejs/node.git
  description-suffix: ' (Werewolf fixed hardening policy)'
  patches: werewolf/patches
  context:
    patches: werewolf/patches
  checks:
    - path: [pipeline, uses=git-checkout]
      expect:
        uses: git-checkout
        with:
          repository: https://github.com/nodejs/node.git
          tag: v${{package.version}}
          expected-commit: ${lock.source_commit}
    - path: [pipeline]
      shape:
        - uses=git-checkout
        - uses=patch
        - name=Configure and build
        - uses=autoconf/make-install
        - runs
        - uses=strip
        - runs
    - path: [subpackages]
      shape:
        - name=${{package.name}}-minimal
        - name=${{package.name}}-minimal-compat
        - name=libnode${{vars.soversion}}
        - name=${{package.name}}-oci-entrypoint-compat
        - name=${{package.name}}-doc
        - name=${{package.name}}-minimal-doc
    - path: [vars, configure-flags]
      expect: --prefix=/usr --shared-brotli --shared-zlib --shared-openssl --shared-cares --shared-nghttp2 --shared-libuv --ninja --openssl-use-def-ca-store --with-icu-default-data-dir=$(icu-config --icudatadir) --with-intl=system-icu --openssl-conf-name=openssl_conf
    - path: [pipeline, name=Configure and build, runs]
      expect: |
        # Add defines recommended in libuv readme.
        case "${{build.arch}}" in
        "aarch64")
           common_flags="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
           ;;
        "x86_64")
           common_flags="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
           ;;
        esac

        # Compiling with O2 instead of Os increases binary size by ~10%
        # (53.1 MiB -> 58.6 MiB), but also increases performance by ~20%
        # according to v8/web-tooling-benchmark. Node.js is quite huge anyway;
        # there are better options for size constrained environments.
        export CFLAGS="${CFLAGS/-Os/-O2} $common_flags"
        export CXXFLAGS="${CXXFLAGS/-Os/-O2} $common_flags"
        export CPPFLAGS="${CPPFLAGS/-Os/-O2} $common_flags"
        # NOTE: --without-corepack is no longer supported in Node.js 25+
        # See: https://nodejs.org/dist/latest/docs/api/corepack.html
        python${{vars.python-version}} configure.py ${{vars.configure-flags}}

          make BUILDTYPE=Release -j$(nproc)
    - path: [pipeline, "1"]
      expect:
        uses: patch
        with:
          patches: ncrypto-pbkdf2-pkcs5.patch
  edits:
    - path: [package, dependencies, provides]
      append:
        - nodejs-hardened=${{package.full-version}}
    - path: [vars, docker-entrypoint-hash]
      delete: true
      exists: true
    - path: [vars, configure-flags]
      replace:
        - old: --prefix=/usr --shared-brotli --shared-zlib --shared-openssl --shared-cares --shared-nghttp2 --shared-libuv --ninja --openssl-use-def-ca-store --with-icu-default-data-dir=$(icu-config --icudatadir) --with-intl=system-icu --openssl-conf-name=openssl_conf
          new: --prefix=/usr --shared-zlib --shared-openssl --shared-cares --shared-nghttp2 --shared-libuv --ninja --openssl-use-def-ca-store --with-icu-default-data-dir=$(icu-config --icudatadir) --with-intl=system-icu --openssl-conf-name=openssl_conf
    - path: [vars, soversion]
      delete: true
      exists: true
    - path: [pipeline, "6"]
      delete: true
      expect:
        runs: |
          rm -rf "${{targets.destdir}}"/usr/lib/node_modules
          rm "${{targets.destdir}}"/usr/bin/npm
          rm "${{targets.destdir}}"/usr/bin/npx
    - path: [pipeline]
      append:
        - name: Omit package managers and documentation
          runs: |
            # --without-npm must actually omit npm, npx and their modules.
            test ! -e "${{targets.destdir}}/usr/bin/npm"
            test ! -e "${{targets.destdir}}/usr/bin/npx"
            test ! -e "${{targets.destdir}}/usr/lib/node_modules/npm"
            rm -R "${{targets.destdir}}/usr/share/man"
    - path: [pipeline, name=Configure and build, runs]
      replace:
        - old: |2
              make BUILDTYPE=Release -j$(nproc)
          new: |2
              # Bubblewrap shows nproc every host CPU, not Melange's budget. Use half
              # of them, and keep Wolfi's memory ratio (cpu 33, memory 64Gi): one
              # compiler job per 2 GiB the host has available.
              jobs=$(awk '/^MemAvailable:/ { print int($2 / 2097152) }' /proc/meminfo)
              [ "$jobs" -le "$(($(nproc) / 2))" ] || jobs=$(($(nproc) / 2))
              [ "$jobs" -ge 1 ] || jobs=1
              make BUILDTYPE=Release JOBS=$jobs -j$jobs
        - old: |
            python${{vars.python-version}} configure.py ${{vars.configure-flags}}
          new: |
            python${{vars.python-version}} configure.py ${{vars.configure-flags}} --without-inspector --without-npm --without-node-options --disable-single-executable-application --without-lief --without-brotli --without-zstd --without-ffi
    - path: [pipeline]
      append:
        - name: Permit capabilities only in the build guest
          runs: |
            mkdir -p /etc/runtime-hardening
            : > /etc/runtime-hardening/build-root
            chmod 600 /etc/runtime-hardening/build-root
            mkdir -p /etc/runtime-hardening/allow/all/node
            for group in exec native inline writable-source environment; do
              : > /etc/runtime-hardening/allow/all/node/$group
            done
      before: "2"
    - path: [test, pipeline]
      append:
        - name: Werewolf protections hold, and allowances take each back
          needs:
            packages:
              - build-base
              - openssl
          runs: |
            ${shared:root-probe-node}work=$(mktemp -d)
            cat > "$work/probe.cjs" <<'WEREWOLF_NODE_PROBE_JS'
            ${file:tests/probe.cjs}WEREWOLF_NODE_PROBE_JS
            cat > "$work/probe.sh" <<'WEREWOLF_NODE_PROBE_SH'
            ${file:tests/probe.sh}WEREWOLF_NODE_PROBE_SH
            cat > "$work/codecs.cjs" <<'WEREWOLF_NODE_PROBE_JS'
            ${file:tests/codecs.cjs}WEREWOLF_NODE_PROBE_JS
            sh "$work/probe.sh" "$work"
    - path: [subpackages, 'name=${{package.name}}-minimal-doc']
      delete: true
    - path: [subpackages, 'name=${{package.name}}-doc']
      delete: true
    - path: [subpackages, 'name=${{package.name}}-oci-entrypoint-compat']
      delete: true
    - path: [subpackages, 'name=libnode${{vars.soversion}}']
      delete: true
    - path: [subpackages, 'name=${{package.name}}-minimal-compat']
      delete: true
    - path: [subpackages, 'name=${{package.name}}-minimal']
      delete: true
  suite-setup:
    name: Permit capabilities only in the build guest
    runs: ${file:tests/build-grants.sh}
  revision: 11
  family: nodejs-
changes:
  - what: Omit npm/npx, inspector, SEA and unused subpackages.
    why: Keep the server runtime without package installation and debugging entrypoints.
    evidence:
      - package.yaml
  - what: Ignore runtime environment options, refuse effective-root initialization, and gate execution, native loading, inline input and writable modules.
    why: Require explicit root-held allowances for dangerous runtime capability groups.
    evidence:
      - package.yaml
  - what: Omit native Brotli/Zstd codecs and negotiate only available HTTP content encodings.
    why: The deployed applications use gzip/deflate; unavailable decoders must not be linked or advertised.
    evidence:
      - patches/0008-omit-optional-compression-libraries.patch
      - tests/codecs.cjs
      - package.yaml
  - what: Disable the standalone node:ffi API.
    why: Keep native addons used by n8n without an additional general-purpose FFI entrypoint.
    evidence:
      - package.yaml
      - tests/codecs.cjs
  - evidence:
      - package.yaml
    what: Omit npm/npx, inspector, SEA, Brotli/Zstd implementations and unused subpackages. Omit node:ffi while retaining native addons, SQLite and TypeScript.
    why: Establish the package's minimized policy.
    claims:
      - minimized
  - evidence:
      - package.yaml
    what: Built-in capability groups deny operations until root-held allowance files grant them; this is independent of the service form.
    why: Establish the package's pledge policy.
    claims:
      - pledge
drop-when: Wolfi ships equivalent policy and installed-package probes verify it; review before retiring this overlay.
