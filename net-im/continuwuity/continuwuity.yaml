# Continuwuity for werewolf's continuwuity form, as Wolfi would package it:
# built by melange in Wolfi's environment with Wolfi's Rust, from the
# release tag's commit. The binary is conduwuit, the name the project
# still builds. io_uring is off: no pledge allows it. Sentry and
# OpenTelemetry, Brotli/Zstd HTTP compression, the admin console and URL
# previews are off. RocksDB keeps its storage codecs. Offered to wolfi-dev/os
# as it is; when Wolfi
# ships it, the form names the package and this file goes.
package:
  name: continuwuity
  version: "26.9.1"
  epoch: 2
  description: A Matrix homeserver, the continuation of conduwuit
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - clang
      - cmake
      - pkgconf
      - patch
      - rust-1.98

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/continuwuity/continuwuity
      tag: v${{package.version}}
      expected-commit: "046074bbc2c8d1af6dd86f93e1c512fbd8b78da8"

  - runs: |
      # OIDC also uses download_media; its imports cannot depend on previews.
      patch --batch --fuzz=0 -p1 < no-preview-build.patch
      features='gzip_compression,element_hacks,jemalloc,jemalloc_conf,ring,bindgen-runtime,release_max_log_level'
      cargo tree --locked --no-default-features -p conduwuit --features "$features" \
        --edges normal --prefix none --format '{p}' > runtime-dependencies.txt
      if grep -E '^(brotli-sys|rustyline-async|termimad|webpage) ' runtime-dependencies.txt; then
        echo 'unexpected optional runtime dependency' >&2
        exit 1
      fi
      # memory-serve retains pure-Rust Brotli for embedded static assets.
      # It must not reappear in the HTTP decoding dependency chain.
      cargo tree --locked --no-default-features -p conduwuit --features "$features" \
        --edges normal --invert brotli --prefix none > brotli-consumers.txt
      if grep -E '^compression-codecs ' brotli-consumers.txt; then
        echo 'Brotli HTTP decoding remains enabled' >&2
        exit 1
      fi
      cargo auditable build --release --locked --no-default-features \
        -p conduwuit --features "$features"
      target/release/conduwuit --version
      install -Dm755 target/release/conduwuit ${{targets.destdir}}/usr/bin/conduwuit

  - uses: strip

update:
  enabled: true
  github:
    identifier: continuwuity/continuwuity
