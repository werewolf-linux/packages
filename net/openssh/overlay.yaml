# Checked changes to the captured Wolfi recipe. See docs/overlays.md.
title: OpenSSH
sources:
- https://github.com/openssh/openssh-portable.git
description-suffix: ' (Werewolf: no PAM, SELinux, zlib or PKCS#11)'
patches: patches
context:
  patches: patches
upstream-patches:
  no-version-check.patch:
    sha256: 8b9598fd81f99d938dbbf833e755a4bd3c6885b9b06faec4f767ad0866b906bf
    source: upstream-patches/no-version-check.patch
checks:
- path: [pipeline, uses=git-checkout]
  expect:
    uses: git-checkout
    with:
      repository: https://github.com/openssh/openssh-portable
      tag: ${{vars.tag-name}}
      expected-commit: ${lock.source_commit}
- path: [pipeline]
  shape:
  - uses=git-checkout
  - uses=patch
  - runs
  - uses=autoconf/configure
  - uses=autoconf/make
  - uses=autoconf/make-install
  - uses=strip
- path: [subpackages]
  shape:
  - name=openssh-doc
  - name=openssh-keygen
  - name=openssh-keyscan
  - name=openssh-keysign
  - name=openssh-sftp-server
  - name=openssh-pkcs11-helper
  - name=openssh-sk-helper
  - name=openssh-server
  - name=openssh-client
  - name=openssh-service
  - name=openssh-server-config
  - name=openssh-pam-config
- path: [pipeline, uses=autoconf/configure, with, opts]
  expect: |
    --sbindir=/usr/bin \
    --sysconfdir=/etc/ssh \
    --libexecdir=/usr/lib/ssh \
    --with-pid-dir=/run \
    --with-mantype=doc \
    --disable-utmp \
    --disable-wtmp \
    --disable-lastlog \
    --disable-strip \
    --with-privsep-path=/var/empty \
    --with-xauth=/usr/bin/xauth \
    --with-default-path='/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin' \
    --with-privsep-user=sshd \
    --with-pam \
    --with-pam-service=sshd \
    --with-libedit \
    --with-selinux
- path: [pipeline, '1']
  expect:
    uses: patch
    with:
      patches: |
        no-version-check.patch
edits:
- path: [environment, contents, packages]
  remove:
  - libselinux-dev
  - linux-pam-dev
  - zlib-dev
- path: [pipeline, uses=autoconf/configure, with, opts]
  replace:
  - old: |
      --sbindir=/usr/bin \
      --sysconfdir=/etc/ssh \
      --libexecdir=/usr/lib/ssh \
      --with-pid-dir=/run \
      --with-mantype=doc \
      --disable-utmp \
      --disable-wtmp \
      --disable-lastlog \
      --disable-strip \
      --with-privsep-path=/var/empty \
      --with-xauth=/usr/bin/xauth \
      --with-default-path='/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin' \
      --with-privsep-user=sshd \
      --with-pam \
      --with-pam-service=sshd \
      --with-libedit \
      --with-selinux
    new: --sbindir=/usr/bin --sysconfdir=/etc/ssh --libexecdir=/usr/lib/ssh --with-pid-dir=/run --with-mantype=doc
      --disable-utmp --disable-wtmp --disable-lastlog --disable-strip --with-privsep-path=/var/empty --with-xauth=/usr/bin/xauth
      --with-default-path='/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin' --with-privsep-user=sshd
      --without-pam --with-libedit --without-selinux --without-zlib --disable-pkcs11
- path: [subpackages, name=openssh-pam-config]
  delete: true
- path: [test, pipeline]
  append:
  - name: Programs link no PAM, SELinux or zlib, and refuse compression and PKCS#11
    runs: |
      cat > /tmp/openssh-probe.sh <<'WEREWOLF_OPENSSH_PROBE'
      ${file:tests/probe.sh}WEREWOLF_OPENSSH_PROBE
      sh /tmp/openssh-probe.sh
