# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  source: git
  repo: atomdrift-project/postdoc
  branch: main
  reason: No stable releases; track main with a dated version and immutable commit pin until upstream tags releases.
melange:
  # postdoc for werewolf's postdoc-server form, as Wolfi would package it:
  # built by melange in Wolfi's environment with Wolfi's Rust, from a
  # commit on main, since postdoc tags no releases. Its engines (cleave,
  # scan, isomer) come from git at the commits Cargo.lock pins. The
  # allocator is the jemalloc linked into the binary, as on every host of
  # the fleet. A new commit is a new version and expected-commit; howl
  # rebuilds when this file changes.
  package:
    name: postdoc
    version: "0.2.0_git20261030"
    epoch: 0
    description: Worker and server coordination for the Atomdrift analysis fleet
    copyright:
      - license: Apache-2.0
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - build-base
        - busybox
        - ca-certificates-bundle
        - cargo-auditable
        - clang
        - cmake
        - git
        - perl
        - pkgconf
        - rust-1.98
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/atomdrift-project/postdoc
        branch: main
        expected-commit: "15a74aef54607c13fa4a9e3da123ef0e9c50f3c0"
    # Cargo's own git, not libgit2, fetches the engines: it follows the
    # environment's CA bundle and proxy as the rest of the build does.
    - runs: |
        export CARGO_NET_GIT_FETCH_WITH_CLI=true
        cargo auditable build --release --locked --no-default-features --features cleave-breadcrumbs
        cargo tree --locked --no-default-features --features cleave-breadcrumbs --edges normal --format '{p} {f}' > /tmp/runtime-features
        if grep tikv-jemalloc /tmp/runtime-features | grep -q profiling; then
          echo "unexpected jemalloc profiling in the default server" >&2
          exit 1
        fi
        target/release/postdoc --help
        install -Dm755 target/release/postdoc ${{targets.destdir}}/usr/bin/postdoc
    - uses: strip
  test:
    pipeline:
      - name: Installed package consumers
        runs: postdoc --help
changes:
  - what: 'postdoc for werewolf''s postdoc-server form, as Wolfi would package it: built by melange in Wolfi''s environment with Wolfi''s Rust, from a commit on main, since postdoc tags no releases. Its engines (cleave, scan, isomer) come from git at the commits Cargo.lock pins. The allocator is the jemalloc linked into the binary, as on every host of the fleet. A new commit is a new version and expected-commit; howl rebuilds when this file changes.'
    why: Provide an independently maintained application context with immutable sources and separately updatable Wolfi dependencies.
    evidence:
      - package.yaml
  - evidence:
      - package.yaml
    what: Disable optional jemalloc heap profiling; retain jemalloc allocation, memory budgets and analysis engines.
    why: Establish the package's minimized policy.
    claims:
      - minimized
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
test:
  confined: true
