# yaml-language-server: $schema=../../docs/package.schema.json
update:
  separator: _
  github:
    identifier: curl/curl
    strip-prefix: curl-
wolfi:
  sources:
    - https://github.com/curl/curl.git
  description-suffix: ' (Werewolf HTTP(S)-only policy)'
  checks:
    - path: [pipeline, uses=git-checkout]
      expect:
        uses: git-checkout
        with:
          repository: https://github.com/curl/curl.git
          tag: curl-${{vars.mangled-package-version}}
          expected-commit: ${lock.source_commit}
    - path: [pipeline]
      shape:
        - uses=git-checkout
        - uses=autoconf/configure
        - uses=autoconf/make
        - name=Run upstream test suite
        - uses=autoconf/make-install
        - uses=strip
    - path: [subpackages]
      shape:
        - name=curl-static
        - name=curl-dev
        - name=curl-doc
        - name=libcurl-openssl4
        - name=${{package.name}}-oci-entrypoint
    - path: [pipeline, name=Run upstream test suite, runs]
      expect: |
        if grep -q '^test-nonflaky:' Makefile; then
          target=test-nonflaky
        else
          target=test
        fi
        log=$(mktemp)
        start=$(date +%s)
        rc=0
        # Named exceptions (curl runtests "!N" syntax):
        #   2095 HTTPS client auth via CURLOPT_SSLCERT_BLOB: the test server resets the
        #        connection after the handshake in the CI (qemu) runner on x86_64 and
        #        aarch64; it passes in a local docker runner.
        # TODO(upstream-tests): investigate 2095 and drop it from the exclusion list.
        make $target TFLAGS="-j$(nproc) !2095" > "$log" 2>&1 || rc=$?
        cat "$log"
        echo "UPSTREAM-TESTS ${{package.name}}: duration=$(( $(date +%s)-start ))s"
        done_line=$(grep -E '^TESTDONE: [0-9]+ tests out of [0-9]+ reported OK' "$log" | tail -n1 || true)
        if [ -n "$done_line" ]; then
          ok=$(echo "$done_line" | sed -n 's/^TESTDONE: \([0-9]*\) tests out of \([0-9]*\).*/\1/p')
          total=$(echo "$done_line" | sed -n 's/^TESTDONE: \([0-9]*\) tests out of \([0-9]*\).*/\2/p')
          skip=$(grep -E '^TESTINFO: [0-9]+ tests were skipped' "$log" | tail -n1 | sed -n 's/^TESTINFO: \([0-9]*\).*/\1/p' || true)
          echo "UPSTREAM-TESTS ${{package.name}}: pass=$ok fail=$((total-ok)) skip=${skip:-0}"
        else
          echo "UPSTREAM-TESTS ${{package.name}}: pass=unknown fail=unknown skip=unknown"
        fi
        rm -f "$log"
        exit $rc
    - path: [pipeline, uses=autoconf/configure, with, opts]
      expect: |
        --enable-ipv6 \
        --enable-kerberos-auth \
        --enable-negotiate-auth \
        --with-gssapi \
        --enable-unix-sockets \
        --with-openssl \
        --without-rustls \
        --with-nghttp2 \
        --with-nghttp3 \
        --with-ngtcp2 \
        --with-pic \
        --enable-ldap \
        --disable-ntlm \
        --without-libssh2 \
        --with-libpsl \
        $([ -d /usr/lib/oldglibc ] && echo ac_cv_func_getpass_r='no' ac_cv_header_stdatomic_h='no')
  edits:
    - path: [package, dependencies, runtime]
      append:
        - libcurl-hardened=${{package.full-version}}
    - path: [package, dependencies, provides]
      absent: true
      set:
        - curl-hardened=${{package.full-version}}
    - path: [environment, contents, packages]
      remove:
        - brotli-dev
        - cyrus-sasl-dev
        - krb5-dev
        - nghttp2-dev
        - nghttp3-dev
        - ngtcp2-dev
        - openldap-dev
    - path: [pipeline]
      append:
        - name: Remove the wcurl shell wrapper
          runs: |
            rm "${{targets.destdir}}/usr/bin/wcurl"
    - path: [pipeline, name=Run upstream test suite, runs]
      replace:
        - old: |
            make $target TFLAGS="-j$(nproc) !2095" > "$log" 2>&1 || rc=$?
          new: |
            make $target TFLAGS="-j$(nproc) !2095 !netrc" > "$log" 2>&1 || rc=$?
    - path: [pipeline, uses=autoconf/configure, with, opts]
      replace:
        - old: |
            --enable-ipv6 \
            --enable-kerberos-auth \
            --enable-negotiate-auth \
            --with-gssapi \
            --enable-unix-sockets \
            --with-openssl \
            --without-rustls \
            --with-nghttp2 \
            --with-nghttp3 \
            --with-ngtcp2 \
            --with-pic \
            --enable-ldap \
            --disable-ntlm \
            --without-libssh2 \
            --with-libpsl \
            $([ -d /usr/lib/oldglibc ] && echo ac_cv_func_getpass_r='no' ac_cv_header_stdatomic_h='no')
          new: --enable-ipv6 --enable-threaded-resolver --disable-ares --with-openssl --without-rustls --with-zlib --with-libpsl --with-pic --disable-static --without-brotli --without-zstd --without-nghttp2 --without-nghttp3 --without-ngtcp2 --without-quiche --without-libssh --without-libssh2 --without-gssapi --without-gsasl --without-libidn2 --without-libuv --disable-ldap --disable-ldaps --disable-ftp --disable-file --disable-ipfs --disable-rtsp --disable-dict --disable-telnet --disable-tftp --disable-pop3 --disable-imap --disable-smtp --disable-gopher --disable-mqtt --disable-websockets --disable-kerberos-auth --disable-negotiate-auth --disable-ntlm --disable-digest-auth --disable-aws --disable-proxy --disable-doh --disable-unix-sockets --disable-netrc --disable-alt-svc --disable-hsts --disable-docs --disable-manual --disable-libcurl-option --without-fish-functions-dir --without-zsh-functions-dir $([ -d /usr/lib/oldglibc ] && echo ac_cv_func_getpass_r='no' ac_cv_header_stdatomic_h='no')
    - path: [subpackages, 'name=${{package.name}}-oci-entrypoint']
      delete: true
    - path: [subpackages, name=libcurl-openssl4, dependencies, provides]
      append:
        - libcurl-hardened=${{package.full-version}}
    - path: [subpackages, name=curl-doc]
      delete: true
    - path: [subpackages, name=curl-dev, dependencies, runtime]
      remove:
        - brotli-dev
        - nghttp2-dev
    - path: [subpackages, name=curl-static]
      delete: true
    - path: [test, pipeline]
      append:
        - name: HTTP works and unsupported protocols and encodings fail closed
          runs: |
            werewolf-tools/package-helper --action probe
    - path: [test, pipeline, uses=test/daemon-check-output, with, setup]
      replace:
        - old: |
            daemon off;
          new: |
            daemon off;
            user root;
    - path: [test, pipeline, "3"]
      delete: true
      expect:
        runs: |
          curl --version | grep -F "ldap ldaps"
          curl --version | grep -F "HTTP3"
  revision: 8
  recipe: curl
changes:
  - what: Build HTTP(S)-only curl/libcurl with TLS, cookies and gzip/deflate; omit other protocols, proxying, HTTP/2, HTTP/3 and unused authentication backends.
    why: Limit the client to the features required by Werewolf consumers; retained library ABI does not imply all Wolfi features remain available.
    evidence:
      - package.yaml
    claims:
      - minimized
  - what: Remove static, documentation and OCI-entrypoint packages and the wcurl shell wrapper.
    why: Avoid shipping unused artifacts or an implicit shell dependency.
    evidence:
      - package.yaml
drop-when: Wolfi ships equivalent policy and installed-package probes verify it; review before retiring this overlay.
actions:
  probe:
    curl:
      binary: curl
      psl: true
      cookies: true
      netrc-disabled: true
