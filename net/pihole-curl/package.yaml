# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  separator: _
  github:
    identifier: curl/curl
    strip-prefix: curl-
melange:
  package:
    name: pihole-curl
    version: 8.23.0
    epoch: 7
    description: HTTP(S)-only musl curl for the Pi-hole OCI filesystem
    copyright:
      - license: curl
    options:
      no-depends: true
      no-provides: true
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-61666e3f.rsa.pub
      packages:
        - alpine-base
        - build-base
        - autoconf
        - automake
        - libtool
        - perl
        - openssl-dev
        - zlib-dev
        - ca-certificates-bundle
        - git
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/curl/curl.git
        tag: curl-8_23_0
        expected-commit: 3163ec065643ba20709f190111f42c3e1fe95273
    - runs: |
        autoreconf -fi
        ./configure --prefix=/usr --enable-ipv6 --enable-threaded-resolver --disable-ares --with-openssl --without-rustls --with-zlib --with-pic --without-brotli --without-zstd --without-nghttp2 --without-nghttp3 --without-ngtcp2 --without-quiche --without-libssh --without-libssh2 --without-gssapi --without-gsasl --without-libidn2 --without-libuv --disable-ldap --disable-ldaps --disable-ftp --disable-file --disable-ipfs --disable-rtsp --disable-dict --disable-telnet --disable-tftp --disable-pop3 --disable-imap --disable-smtp --disable-gopher --disable-mqtt --disable-websockets --disable-kerberos-auth --disable-negotiate-auth --disable-ntlm --disable-digest-auth --disable-aws --disable-proxy --disable-doh --disable-unix-sockets --disable-netrc --disable-alt-svc --disable-hsts --disable-docs --disable-manual --disable-libcurl-option --without-fish-functions-dir --without-zsh-functions-dir --disable-shared --enable-static --disable-cookies --without-libpsl --disable-mime --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt --with-ca-path=/etc/ssl/certs
        make -j$(nproc)
        werewolf-tools/package-helper --action probe
        # libcurl is linked into this executable; TLS/zlib use the image libraries.
        install -Dm755 src/curl "${{targets.destdir}}/oci/pi-hole/usr/lib/werewolf-pihole/curl"
        install -Dm644 COPYING "${{targets.destdir}}/usr/share/licenses/pihole-curl/COPYING"
    - uses: strip
  test:
    environment:
      contents:
        repositories:
          - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
        packages:
          - musl
          - libssl3
          - libcrypto3
          - zlib
    pipeline:
      - name: Installed OCI executable against Alpine libraries
        runs: |
          werewolf-tools/package-helper curl --binary /oci/pi-hole/usr/lib/werewolf-pihole/curl --musl
changes:
  - what: Install a musl curl executable only inside the Pi-hole OCI tree, with libcurl linked in and solver dependency/provide inference disabled.
    why: Preserve the OCI image ABI and its TLS/zlib libraries without altering the host Wolfi package solver.
    evidence:
      - package.yaml
  - evidence:
      - package.yaml
    what: Build HTTP(S)-only curl without unused protocols, authentication backends, cookies, MIME or optional compression libraries.
    why: Establish the package's minimized policy.
    claims:
      - minimized
drop-when: The Pi-hole OCI image supplies an equivalent restricted curl and its blocklist/confinement tests pass.
actions:
  probe:
    curl:
      binary: ./src/curl
      musl: true
