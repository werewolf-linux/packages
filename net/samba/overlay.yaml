# Checked changes to the captured Wolfi recipe (internal/overlay).
title: Samba
sources:
- https://github.com/samba-team/samba.git
- https://git.samba.org/samba.git
description-suffix: ' (Werewolf: no PAM)'
checks:
- path: [pipeline, uses=git-checkout]
  expect:
    uses: git-checkout
    with:
      repository: https://github.com/samba-team/samba
      tag: samba-${{package.version}}
      expected-commit: ${lock.source_commit}
- path: [pipeline]
  shape:
  - uses=git-checkout
  - uses=patch
  - uses=autoconf/configure
  - uses=autoconf/make
  - uses=autoconf/make-install
  - runs
  - uses=strip
- path: [subpackages]
  shape:
  - name=samba-common
  - name=samba-dev
  - name=samba-libs-py3
  - name=samba-common-tools
  - name=samba-common-server-libs
  - name=libsmbclient
  - name=samba-client
  - name=samba-server-libs
  - name=winbind
  - name=samba-util-libs
  - name=libwbclient
  - name=samba-winbind-clients
  - name=samba-libnss-winbind
  - name=samba-winbind-krb5-locator
  - name=samba-pam-winbind
  - name=samba-server
  - name=py${{vars.python-version}}-samba
  - name=samba-test
  - name=libauth-samba
  - name=samba-libs
edits:
- path: [environment, contents, packages]
  remove:
  - linux-pam-dev
- path: [pipeline, uses=autoconf/configure, with, opts]
  expect: |
    --prefix=/usr \
    --sbindir=/usr/bin \
    --sysconfdir=/etc/${{package.name}} \
    --with-configdir=/etc/${{package.name}} \
    --localstatedir=/var \
    --libexecdir=/usr/lib \
    --enable-fhs \
    --with-lockdir=/var/cache/${{package.name}} \
    --with-piddir=/run/${{package.name}} \
    --with-logfilebase=/var/log/${{package.name}} \
    --with-pam \
    --without-systemd \
    --with-ads \
    --with-shared-modules="$IDMAP_MODULES,$PDB_MODULES,$AUTH_MODULES,vfs_io_uring" \
    --enable-cups \
    --without-gettext \
    --bundled-libraries=NONE,ntdb,roken,wind,hx509,asn1,heimbase,hcrypto,krb5,gssapi,heimntlm,hdb,kdc,cmocka \
    --disable-rpath-install \
    --without-gpgme \
    --disable-fault-handling \
    --private-libraries='!ldb,!samba-credentials' \
    --without-regedit
  replace:
  - old: "--with-pam \\\n"
    new: "--without-pam \\\n"
- path: [subpackages, name=samba-pam-winbind]
  delete: true
- path: [test, pipeline]
  append:
  - name: No PAM module, and nothing Samba installs loads libpam
    runs: |
      cat > /tmp/samba-probe.sh <<'WEREWOLF_SAMBA_PROBE'
      ${file:tests/probe.sh}WEREWOLF_SAMBA_PROBE
      sh /tmp/samba-probe.sh
