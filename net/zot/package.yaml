# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  github:
    identifier: project-zot/zot
    strip-prefix: v
melange:
  # zot for werewolf's zot form, as Wolfi would package it: built by melange
  # in Wolfi's environment with Wolfi's Go, static (no cgo), from the release
  # tag's commit, as upstream's Makefile builds zot-minimal: the registry
  # alone, with no extensions (search, sync, UI, metrics exporter), so none
  # can be turned on by a config line, and as a PIE, which ASLR moves. Go
  # fetches its modules, which go.sum pins. Wolfi's zot is the full build,
  # every extension in it, at a fixed address; when Wolfi ships zot-minimal
  # as a PIE, the form names it and this file goes.
  package:
    name: zot
    version: 2.1.22
    epoch: 9
    description: OCI-native container image registry
    copyright:
      - license: Apache-2.0
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
        - ca-certificates-bundle
        - git
        - go-1.27
        - patch
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/project-zot/zot
        tag: v${{package.version}}
        expected-commit: 6bbc7e56db2b7a64eee589324efe5813245e3a28
    # Upstream's --version prints build details but omits the injected release tag.
    - runs: patch -p1 < version.patch
    - uses: go-deps
      with:
        packages: ./cmd/zot
        experiments: jsonv2
    - runs: |
        b=zotregistry.dev/zot/v2/pkg/buildinfo
        CGO_ENABLED=0 GOEXPERIMENT=jsonv2 go build -buildmode=pie -trimpath -ldflags="-s -w \
          -X $b.ReleaseTag=v${{package.version}} \
          -X $b.Commit=$(git rev-parse HEAD) \
          -X $b.BinaryType=minimal \
          -X $b.GoVersion=$(go env GOVERSION)" \
          -o zot ./cmd/zot
        ./zot --version | grep -F 'v${{package.version}}'
        install -Dm755 zot ${{targets.destdir}}/usr/bin/zot
  test:
    pipeline:
      - name: Installed package consumers
        runs: zot --version | grep -F '${{package.version}}'
changes:
  - what: 'zot for werewolf''s zot form, as Wolfi would package it: built by melange in Wolfi''s environment with Wolfi''s Go, static (no cgo), from the release tag''s commit, as upstream''s Makefile builds zot-minimal: the registry alone, with no extensions (search, sync, UI, metrics exporter), so none can be turned on by a config line, and as a PIE, which ASLR moves. Go fetches its modules, which go.sum pins. Wolfi''s zot is the full build, every extension in it, at a fixed address; when Wolfi ships zot-minimal as a PIE, the form names it and this file goes.'
    why: Provide an independently maintained application context with immutable sources and separately updatable Wolfi dependencies.
    evidence:
      - package.yaml
    claims:
      - minimized
drop-when: Wolfi provides equivalent packaging, supported versions, architectures and required hardening; review compatibility before retiring this context.
test:
  confined: true
