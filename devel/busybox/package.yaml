# yaml-language-server: $schema=../../Werewolf/package.schema.json
update:
  version-pattern: ^([0-9]+)_([0-9]+)_([0-9]+)$
  version-replace: ${1}.${2}.${3}
  github:
    identifier: vda-linux/busybox_mirror
    use-tag: true
wolfi:
  upstream-patch-prefix: ../
  patch-working-directory: build
  sources:
    - https://github.com/vda-linux/busybox_mirror.git
    - https://git.busybox.net/busybox.git
  description-suffix: ' (Werewolf: applets exec applets by path)'
  test-unpinned:
    - busybox
    - busybox-full
    - busybox-static
  upstream-patches:
    CVE-2024-58251-2.patch:
      sha256: 0d984c0eb2ffebe8b3b8ed0d16cb08293ce36241a814058b30c303a29d6a6594
      source: upstream-patches/CVE-2024-58251-2.patch
  checks:
    - path: [pipeline, uses=git-checkout]
      expect:
        uses: git-checkout
        working-directory: build
        with:
          expected-commit: ${lock.source_commit}
          repository: https://github.com/vda-linux/busybox_mirror
          tag: ${{vars.mangled-package-version}}
    - path: [pipeline]
      shape:
        - uses=git-checkout
        - uses=patch
        - uses=patch
        - uses=patch
        - uses=patch
        - uses=patch
        - uses=patch
        - uses=patch
        - uses=patch
        - uses=patch
        - uses=patch
        - uses=patch
        - uses=patch
        - name=Configure
        - runs
        - name=Install
        - uses=strip
    - path: [subpackages]
      shape:
        - name=busybox-full
        - name=busybox-static
    - path: [pipeline, name=Configure, runs]
      expect: |
        cp ../busyboxconfig .config
    - path: [subpackages, name=busybox-static, pipeline, name=Configure, runs]
      expect: |
        sed -e 's/^# CONFIG_STATIC is not set$/CONFIG_STATIC=y/' \
            -e 's/^# CONFIG_STATIC_LIBGCC is not set/CONFIG_STATIC_LIBGCC=y/' \
            -e 's/^# CONFIG_USE_BB_PWD_GRP is not set/CONFIG_USE_BB_PWD_GRP=y/' \
            -e 's/^# CONFIG_USE_BB_SHADOW is not set/CONFIG_USE_BB_SHADOW=y/' \
            -e 's/^# CONFIG_USE_BB_CRYPT is not set/CONFIG_USE_BB_CRYPT=y/' \
            -e 's/^# CONFIG_USE_BB_CRYPT_SHA is not set/CONFIG_USE_BB_CRYPT_SHA=y/' \
            ../busyboxconfig > .config
        # yescrypt (USE_BB_CRYPT_YES, new in 1.38.0) is a sub-option of
        # USE_BB_CRYPT, which is disabled in the base config, so there is no
        # line to substitute above; append it
        echo "CONFIG_USE_BB_CRYPT_YES=y" >> .config
        # emit diff for verification, diff returns 1 on differences,
        # ensure there actually is a difference
        rc=0
        diff -u ../busyboxconfig .config || rc="$?"
        if [ "$rc" -ne 1 ]; then
           echo "ERROR: expected the generated static config to differ from the default config" >&2
           exit 1
        fi
    - path: [subpackages, name=busybox-full, pipeline, name=Configure, runs]
      expect: |
        cp ../busyboxconfig-full .config
    - path: [pipeline, "1"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../CVE-2022-28391-1.patch ../CVE-2022-28391-2.patch
    - path: [pipeline, "2"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../0001-tar-fix-TOCTOU-symlink-race-condition.patch
    - path: [pipeline, "3"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../0037-awk.c-fix-CVE-2023-42366-bug-15874.patch
    - path: [pipeline, "4"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../CVE-2024-58251-2.patch
    - path: [pipeline, "5"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../CVE-2025-46394.patch
    - path: [pipeline, "6"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../CVE-2025-60876.patch
    - path: [pipeline, "7"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../archival-disallow-path-traversals-CVE-2023-39810.patch
    - path: [pipeline, "8"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: |
            ../0001-tar-strip-unsafe-hardlink-components-GNU-tar-does-th.patch
            ../0002-tar-only-strip-unsafe-components-from-hardlinks-not-.patch
    - path: [pipeline, "9"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../CVE-2026-38753.patch
    - path: [pipeline, "10"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../CVE-2026-38752.patch
    - path: [pipeline, "11"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../CVE-2026-38754.patch
    - path: [pipeline, "12"]
      expect:
        uses: patch
        working-directory: build
        with:
          patches: ../CVE-2026-38755.patch
  edits:
    - path: [pipeline, name=Configure, runs]
      replace:
        - old: |
            cp ../busyboxconfig .config
          new: |
            cp ../busyboxconfig .config
            # Werewolf: an applet run by name runs from /usr/bin/busybox, with no PATH
            # search, which Werewolf's glibc refuses (devel/busybox/README.md).
            sed -i 's/^# CONFIG_FEATURE_PREFER_APPLETS is not set$/CONFIG_FEATURE_PREFER_APPLETS=y/' .config
            grep -qx 'CONFIG_FEATURE_PREFER_APPLETS=y' .config
            grep -qx 'CONFIG_BUSYBOX_EXEC_PATH="/usr/bin/busybox"' .config
    - path: [subpackages, name=busybox-static, pipeline, name=Configure, runs]
      replace:
        - old: |
            fi
          new: |
            fi
            # Werewolf: an applet run by name runs from /usr/bin/busybox, with no PATH
            # search, which Werewolf's glibc refuses (devel/busybox/README.md).
            sed -i 's/^# CONFIG_FEATURE_PREFER_APPLETS is not set$/CONFIG_FEATURE_PREFER_APPLETS=y/' .config
            grep -qx 'CONFIG_FEATURE_PREFER_APPLETS=y' .config
            grep -qx 'CONFIG_BUSYBOX_EXEC_PATH="/usr/bin/busybox"' .config
    - path: [subpackages, name=busybox-static, test, pipeline]
      append:
        - name: Tools run applets by name without searching PATH
          runs: |
            cat > /tmp/busybox-probe.sh <<'WEREWOLF_BUSYBOX_PROBE'
            ${file:tests/probe.sh}WEREWOLF_BUSYBOX_PROBE
            /usr/bin/busybox sh /tmp/busybox-probe.sh
    - path: [subpackages, name=busybox-full, pipeline, name=Configure, runs]
      replace:
        - old: |
            cp ../busyboxconfig-full .config
          new: |
            cp ../busyboxconfig-full .config
            # Werewolf: an applet run by name runs from /usr/bin/busybox, with no PATH
            # search, which Werewolf's glibc refuses (devel/busybox/README.md).
            sed -i 's/^# CONFIG_FEATURE_PREFER_APPLETS is not set$/CONFIG_FEATURE_PREFER_APPLETS=y/' .config
            grep -qx 'CONFIG_FEATURE_PREFER_APPLETS=y' .config
            grep -qx 'CONFIG_BUSYBOX_EXEC_PATH="/usr/bin/busybox"' .config
    - path: [subpackages, name=busybox-full, test, pipeline]
      append:
        - name: Tools run applets by name without searching PATH
          runs: |
            cat > /tmp/busybox-probe.sh <<'WEREWOLF_BUSYBOX_PROBE'
            ${file:tests/probe.sh}WEREWOLF_BUSYBOX_PROBE
            /usr/bin/busybox sh /tmp/busybox-probe.sh
    - path: [test, pipeline]
      append:
        - name: Tools run applets by name without searching PATH
          runs: |
            cat > /tmp/busybox-probe.sh <<'WEREWOLF_BUSYBOX_PROBE'
            ${file:tests/probe.sh}WEREWOLF_BUSYBOX_PROBE
            /usr/bin/busybox sh /tmp/busybox-probe.sh
    - path: [pipeline, name=Install, runs]
      replace:
        - old: |
            ./busybox --list-path > "${{targets.destdir}}"/etc/busybox-paths.d/busybox
          new: |
            ./busybox --list-path > "${{targets.destdir}}"/etc/busybox-paths.d/busybox
            # /bin/sh belongs to mksh, including developer images.
            sed -i '\|^bin/sh$|d;\|^usr/bin/sh$|d' "${{targets.destdir}}"/etc/busybox-paths.d/busybox
    - path: [package, scriptlets, trigger, script]
      expect: |
        #!/usr/bin/busybox sh
        /usr/bin/busybox --install -s
      set: |
        #!/usr/bin/busybox sh
        for manifest in /etc/busybox-paths.d/*; do
          [ -f "$manifest" ] || continue
          while IFS= read -r path; do
            case "$path" in bin/sh|usr/bin/sh) continue ;; esac
            [ -e "/$path" ] || [ -L "/$path" ] || /usr/bin/busybox ln -s /usr/bin/busybox "/$path"
          done < "$manifest"
        done
    - path: [subpackages, name=busybox-full, pipeline, name=Install, runs]
      replace:
        - old: |
            ./busybox --list-path > "${{targets.subpkgdir}}"/etc/busybox-paths.d/busybox-full
          new: |
            ./busybox --list-path > "${{targets.subpkgdir}}"/etc/busybox-paths.d/busybox-full
            # /bin/sh belongs to mksh, including developer images.
            sed -i '\|^bin/sh$|d;\|^usr/bin/sh$|d' "${{targets.subpkgdir}}"/etc/busybox-paths.d/busybox-full
    - path: [subpackages, name=busybox-full, scriptlets, trigger, script]
      expect: |
        #!/usr/bin/busybox sh
        /usr/bin/busybox --install -s
      set: |
        #!/usr/bin/busybox sh
        for manifest in /etc/busybox-paths.d/*; do
          [ -f "$manifest" ] || continue
          while IFS= read -r path; do
            case "$path" in bin/sh|usr/bin/sh) continue ;; esac
            [ -e "/$path" ] || [ -L "/$path" ] || /usr/bin/busybox ln -s /usr/bin/busybox "/$path"
          done < "$manifest"
        done
    - path: [subpackages, name=busybox-static, pipeline, name=Install, runs]
      replace:
        - old: |
            ./busybox --list-path > "${{targets.subpkgdir}}"/etc/busybox-paths.d/busybox-static
          new: |
            ./busybox --list-path > "${{targets.subpkgdir}}"/etc/busybox-paths.d/busybox-static
            # /bin/sh belongs to mksh, including developer images.
            sed -i '\|^bin/sh$|d;\|^usr/bin/sh$|d' "${{targets.subpkgdir}}"/etc/busybox-paths.d/busybox-static
    - path: [subpackages, name=busybox-static, scriptlets, trigger, script]
      expect: |
        #!/usr/bin/busybox sh
        /usr/bin/busybox --install -s
      set: |
        #!/usr/bin/busybox sh
        for manifest in /etc/busybox-paths.d/*; do
          [ -f "$manifest" ] || continue
          while IFS= read -r path; do
            case "$path" in bin/sh|usr/bin/sh) continue ;; esac
            [ -e "/$path" ] || [ -L "/$path" ] || /usr/bin/busybox ln -s /usr/bin/busybox "/$path"
          done < "$manifest"
        done
    # The test harness needs /bin/sh; BusyBox no longer installs that link.
    - path: [test, environment, contents, packages]
      append:
        - bash-binsh
    # The test harness needs /bin/sh; BusyBox no longer installs that link.
    - path: [subpackages, name=busybox-full, test, environment, contents, packages]
      append:
        - bash-binsh
    # The test harness needs /bin/sh; BusyBox no longer installs that link.
    - path: [subpackages, name=busybox-static, test, environment, contents, packages]
      append:
        - bash-binsh
    # Keep the upstream download assertion with a local, single-connection fixture.
    - path: [subpackages, name=busybox-full, test, environment, contents, packages]
      remove:
        - python3
    - path: [subpackages, name=busybox-full, test, pipeline, name=Test wget can download a file, runs]
      expect: |
        # Create test content for HTTP server
        mkdir -p /tmp/www
        echo "wget test content" > /tmp/www/test.txt

        # Start Python HTTP server
        cd /tmp/www
        python3 -m http.server 8888 > /tmp/httpd.log 2>&1 &
        SERVER_PID=$!

        # Wait for server to be ready
        sleep 2

        # Test wget download
        wget -O /tmp/downloaded.txt http://127.0.0.1:8888/test.txt

        # Verify downloaded content
        if ! grep -F "wget test content" /tmp/downloaded.txt; then
          echo "FAIL: wget did not download expected content"
          cat /tmp/downloaded.txt
          kill "$SERVER_PID"
          exit 1
        fi

        echo "PASS: wget successfully downloaded file"

        # Cleanup
        kill "$SERVER_PID"
      set: ${file:tests/wget.sh}
  revision: 8
  recipe: busybox
changes:
  - what: Enable CONFIG_FEATURE_PREFER_APPLETS in busybox, busybox-full and busybox-static, keeping BUSYBOX_EXEC_PATH /usr/bin/busybox.
    why: Werewolf's glibc refuses a bare-name execvp rather than search PATH, so env, timeout, nohup, nice, xargs, setsid, time, flock and chroot could run no command by name; an applet named bare now runs through busybox's absolute path.
    evidence:
      - package.yaml
      - tests/probe.sh
  - what: Exclude /bin/sh from all BusyBox applet-link manifests and APK triggers.
    why: mksh owns /bin/sh; installing or updating BusyBox must not change its behavior.
    evidence:
      - package.yaml
      - tests/probe.sh
drop-when: Wolfi enables FEATURE_PREFER_APPLETS, or Werewolf's glibc searches PATH again; review before retiring this overlay.
