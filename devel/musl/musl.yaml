package:
  name: musl-werewolf
  version: 1.2.6
  epoch: 2
  description: musl with local resolver socket confinement
  copyright:
    - license: MIT

environment:
  contents:
    repositories: [https://packages.wolfi.dev/os]
    keyring: [https://packages.wolfi.dev/os/wolfi-signing.rsa.pub]
    packages: [busybox, gcc, binutils, make, patch]

pipeline:
  - uses: fetch
    with:
      uri: https://musl.libc.org/releases/musl-${{package.version}}.tar.gz
      expected-sha256: d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a
      # musl.libc.org takes 4-7 s to finish TLS and over 10 s to answer: past
      # wget's default 5 s, which fails the handshake without a retry.
      timeout: 60
  - uses: patch
    with:
      patches: 0001-regcomp-overflow.patch
  - uses: patch
    with:
      patches: 0002-local-resolver-bind.patch
  - runs: |
      ./configure --prefix=/usr/lib/werewolf-musl --syslibdir=/usr/lib/werewolf-musl --disable-static --disable-wrapper CFLAGS='-O2 -fstack-protector-strong' LDFLAGS='-Wl,-z,relro,-z,now,-z,noexecstack'
      make -j$(nproc)
      gcc -std=c99 -Wall -Wextra -Werror -nostdinc -Iarch/${{build.arch}} -Iarch/generic -Iobj/include -Iinclude -fPIE -pie -nostdlib -Wl,--dynamic-linker=/lib/libc.so lib/Scrt1.o lib/crti.o tests/resolver.c -Llib -lc -lgcc lib/crtn.o -o tests/probe
      mkdir -p tests/root/lib tests/root/etc
      cp lib/libc.so tests/root/lib/libc.so
      cp tests/probe tests/root/probe
      ./lib/libc.so tests/probe tests/root
      install -Dm755 lib/libc.so "${{targets.destdir}}/usr/lib/werewolf-musl/libc.so"
      install -Dm644 COPYRIGHT "${{targets.destdir}}/usr/share/licenses/musl-werewolf/COPYRIGHT"
update:
  enabled: false
